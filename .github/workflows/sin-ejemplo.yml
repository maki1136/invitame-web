# ===== NINGUNA INVITACIÓN CON DATOS DE EJEMPLO (6/11/2026) =====================
#
# Maki: «¿cómo me aseguro que no vuelva a pasar? En ninguna invi».
# (el pase de «Hugo y Lucía» en citlalli-y-hedwin-jesus, y antes «María & Diego»)
#
# Corre chequeo/sin-ejemplo.mjs: abre TODAS las invitaciones como le llegan al
# invitado (con y sin link personal) y busca cualquier texto de la boda de
# ejemplo del molde. Se dispara:
#   · cada vez que se publica (3 minutos después, cuando Hostinger ya lo subió)
#   · todos los días a las 9:07 de Argentina
#   · a mano
# Si encuentra algo, abre un aviso («issue», etiqueta «datos-de-ejemplo»):
# GitHub le manda el mail a Maki. Cuando vuelve a dar bien, lo cierra solo.
# Sólo le avisa a Maki. No le escribe a ningún cliente (REGLA CERO).
# ==============================================================================
name: Sin datos de ejemplo en las invitaciones

on:
  workflow_run:
    workflows: ["Publicar al sitio de verdad"]
    types: [completed]
  schedule:
    - cron: '7 12 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: sin-ejemplo
  cancel-in-progress: false

jobs:
  revisar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Esperar que Hostinger suba lo publicado
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 180
      - name: Revisar todas las invitaciones
        id: rev
        run: |
          set +e
          node chequeo/sin-ejemplo.mjs
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
          cat chequeo/sin-ejemplo.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Avisar a Maki (o cerrar el aviso)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CODIGO: ${{ steps.rev.outputs.codigo }}
        run: |
          api() { curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          abierto=$(api "https://api.github.com/repos/$REPO/issues?state=open&labels=datos-de-ejemplo&per_page=1" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["number"] if isinstance(d,list) and d else "")')
          hora=$(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')
          detalle=$(cat chequeo/sin-ejemplo.txt)
          if [ "$CODIGO" != "0" ]; then
            texto=$(printf '⚠️ **Hay invitaciones que muestran datos de la boda de ejemplo al cargar** (%s, hora Argentina).\n\n```\n%s\n```\n\nSe arregla en i/index.php (escribir el dato real desde el servidor o dejarlo vacío). Cuando el chequeo vuelva a dar bien, este aviso se cierra solo.' "$hora" "$detalle")
            if [ -z "$abierto" ]; then
              python3 -c 'import json,sys; print(json.dumps({"title":"⚠️ Invítame: invitaciones con datos de ejemplo","body":sys.argv[1],"labels":["datos-de-ejemplo"]}))' "$texto" > cuerpo.json
              api -X POST "https://api.github.com/repos/$REPO/issues" -d @cuerpo.json > /dev/null && echo "Aviso abierto."
            else
              python3 -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "$texto" > cuerpo.json
              api -X POST "https://api.github.com/repos/$REPO/issues/$abierto/comments" -d @cuerpo.json > /dev/null && echo "Comentario en el aviso #$abierto."
            fi
            exit 1
          elif [ -n "$abierto" ]; then
            python3 -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "✅ Ninguna invitación muestra datos de ejemplo ($hora, hora Argentina)." > cuerpo.json
            api -X POST "https://api.github.com/repos/$REPO/issues/$abierto/comments" -d @cuerpo.json > /dev/null
            api -X PATCH "https://api.github.com/repos/$REPO/issues/$abierto" -d '{"state":"closed"}' > /dev/null
            echo "Aviso cerrado."
          else
            echo "Todo bien."
          fi
