# ============================================================================
#  SITIO DE PRUEBA — prueba.invitameok.net (8/10/2026)
#
#  Cada vez que se sube algo a la rama `prueba`, este workflow lo publica SOLO
#  en el sitio de prueba, por FTP, con una cuenta que únicamente puede entrar a
#  la carpeta public_html/sitio-prueba. No puede tocar el sitio de verdad.
#
#  · Usuario FTP: u395354963.sitioprueba   (carpeta: public_html/sitio-prueba)
#  · La contraseña la pegó Maki en GitHub → Settings → Secrets → PRUEBA_FTP_CLAVE
#  · El sitio de prueba usa la MISMA base de datos: se prueba sólo con muestras.
#  · Se marca «noindex» para que Google no lo muestre.
#  Para pasar lo probado al sitio de verdad: el botón «Publicar al sitio de verdad».
# ============================================================================
name: Sitio de prueba

on:
  push:
    branches: [prueba]
  workflow_dispatch:

concurrency:
  group: sitio-prueba
  cancel-in-progress: true

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Marcar como sitio de prueba (que Google no lo indexe)
        run: |
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          { printf '<IfModule mod_headers.c>\n  Header always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n\n'; cat .htaccess; } > .htaccess.nuevo
          mv .htaccess.nuevo .htaccess

      - name: Anti-robots (Turnstile) SOLO en el sitio de prueba
        # Si existe el secreto TURNSTILE_SECRETA, se arma el archivo de claves adentro
        # de la carpeta del sitio de prueba. El sitio de verdad (public_html) no lo ve:
        # anti-robot-lib.php busca el archivo subiendo carpetas desde la suya.
        # Sin el secreto no se arma nada y el formulario anda como siempre.
        env:
          SECRETA: ${{ secrets.TURNSTILE_SECRETA }}
        run: |
          if [ -n "$SECRETA" ]; then
            python3 - <<'PY'
          import os
          s=os.environ['SECRETA'].strip().replace("\\","").replace("'","")
          open('invitame-turnstile.php','w').write("<?php\n$TURNSTILE_SITE   = '0x4AAAAAAFQ9Ytfhhym2ka5-';\n$TURNSTILE_SECRET = '"+s+"';\n")
          PY
            echo "Turnstile: archivo de claves armado para el sitio de prueba"
          else
            echo "Turnstile: sin secreto, queda apagado"
          fi

      - name: Subir por FTP a la carpeta del sitio de prueba
        env:
          CLAVE: ${{ secrets.PRUEBA_FTP_CLAVE }}
        run: |
          if [ -z "$CLAVE" ]; then echo "Falta el secreto PRUEBA_FTP_CLAVE"; exit 1; fi
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          cat > subir.lftp <<'LFTP'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          open --env-password -u u395354963.sitioprueba ftp://82.25.67.148
          mirror -R --delete --parallel=8 --verbose=1 --exclude-glob .git* --exclude ^\.git/ --exclude ^\.github/ --exclude ^worker/ --exclude ^herramientas/ --exclude ^chequeo/capturas/ --exclude ^subir\.lftp$ ./ ./
          bye
          LFTP
          LFTP_PASSWORD="$CLAVE" lftp -f subir.lftp

      - name: Comprobar que el sitio de prueba responde
        run: |
          sleep 5
          c=$(curl -s -o /dev/null -w '%{http_code}' "https://prueba.invitameok.net/i/?e=camila-y-tomas&cb=$RANDOM" || true)
          echo "prueba.invitameok.net → $c"
