<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAF6F2">
<title>Moderar galería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ============================================================
   El mismo lenguaje visual que la galería y el cartel (ver
   claude/GALERIA-diseno.md): claro sobre claro, relieve en capas,
   la luz siempre de arriba a la izquierda, esferas blush.

   ⚠️ UNA DESVIACIÓN A PROPÓSITO: los botones de decidir.
   Acá se decide rápido y bajo presión, en la fiesta. Si "No va" y
   "A pantalla" se parecen, alguien va a apretar el que no era.
   Por eso aprobar conserva su color propio y BAJAR sigue rojo:
   son controles de seguridad, no decoración.
   ============================================================ */
:root{
  --uva:#6D1233;
  --tinta:#4A3038;--suave:#9B8880;
  --crema:#FAF6F2;--papel:#FFFDFB;--linea:#EADFD7;
  --blush:#EDC0B2;--blush-luz:#FBDFD5;--blush-hondo:#DDA292;
  --rosa:#EDC0B2;                 /* lo pisa la marca del evento */
  --ok:#5C8F73;--no:#A2908A;--rojo:#A3242F;
  --relieve-1:
    0 1px 1px rgba(90,60,55,.05),
    0 2px 4px rgba(90,60,55,.06),
    0 5px 9px -3px rgba(90,60,55,.08);
  --relieve-2:
    0 1px 1px rgba(90,60,55,.07),
    0 3px 6px rgba(90,60,55,.08),
    0 9px 16px -4px rgba(90,60,55,.12),
    0 20px 30px -12px rgba(90,60,55,.18);
  --relieve-3:
    0 1px 2px rgba(90,60,55,.09),
    0 4px 8px rgba(90,60,55,.10),
    0 12px 20px -5px rgba(90,60,55,.14),
    0 26px 40px -12px rgba(90,60,55,.22);
  --luz-arriba:inset 0 1px 0 rgba(255,255,255,.92);
  --sombra-esfera:
    0 1px 2px rgba(120,80,70,.16),
    5px 7px 12px -2px rgba(120,80,70,.26);
  --sombra:var(--relieve-2);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--crema);
  background-image:
    radial-gradient(76% 36% at 16% 0%, rgba(237,192,178,.28) 0%, transparent 62%),
    radial-gradient(60% 30% at 96% 18%, rgba(206,197,187,.32) 0%, transparent 64%);
  background-attachment:fixed;
  color:var(--tinta);
  font-family:"Nunito",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100dvh;
}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;display:block}

/* ---------- cabecera: una tarjeta que flota, no una barra de color ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(255,253,251,.9);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--linea);
  color:var(--tinta);
  padding:14px 16px 0;
  box-shadow:var(--relieve-2);
}
.hd-fila{display:flex;align-items:center;gap:12px;padding-bottom:12px;flex-wrap:wrap}
.hd-tit{flex:1;min-width:0}
.hd-tit .ojal{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);font-weight:700}
.hd-tit h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:1.42rem;margin:1px 0 0;color:var(--uva);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hd-uso{font-size:.7rem;color:var(--suave);text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
/* Se abren en la compu del que está manejando la fiesta. */
.hd-pantalla{
  display:flex;align-items:center;gap:8px;flex:none;text-decoration:none;color:var(--tinta);
  background:linear-gradient(158deg,#FFFDFB,#F6F1EC);
  border:1px solid rgba(255,255,255,.9);
  border-radius:14px;padding:8px 12px;font-size:.72rem;font-weight:700;line-height:1.2;
  box-shadow:var(--relieve-1), var(--luz-arriba);
  transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s ease;
}
.hd-pantalla:active{transform:translateY(2px);box-shadow:none}
.hd-pantalla .ico{width:20px;height:20px;flex:none;color:var(--blush-hondo)}
/* En un celular el nombre de la fiesta se llevaba puestos los botones y
   quedaba cortado ("María & …"). Que se lleve su propio renglón. */
@media (max-width:520px){
  .hd-tit{flex:1 0 100%}
  .hd-uso{text-align:left;flex:1;min-width:120px}
}
.tabs{display:flex;gap:0;margin:0 -16px;padding:0 16px;border-top:1px solid var(--linea)}
.tabs button{
  flex:1;border:none;background:none;color:var(--suave);
  padding:13px 6px;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;
  border-bottom:2.5px solid transparent;display:flex;align-items:center;
  justify-content:center;gap:7px;
}
.tabs button.activa{color:var(--uva);border-bottom-color:var(--blush-hondo)}
/* la pastilla del contador: una esferita blush estirada */
.pastilla{
  background:radial-gradient(120% 100% at 30% 12%, var(--blush-luz) 0%, transparent 62%), var(--rosa);
  color:#7A4034;border-radius:99px;font-weight:800;
  padding:1px 9px;font-size:.72rem;font-variant-numeric:tabular-nums;min-width:22px;
  box-shadow:0 1px 2px rgba(150,95,80,.18), inset 0 1px 0 rgba(255,255,255,.7);
}
.tabs button:not(.activa) .pastilla{
  background:#EFE7E1;color:var(--suave);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}

/* ---------- login ---------- */
#login,#estado{max-width:400px;margin:60px auto;padding:0 20px;text-align:center}
#login .caja{
  background:var(--papel);border:1px solid rgba(255,255,255,.9);border-radius:24px;
  padding:34px 26px;box-shadow:var(--relieve-3), var(--luz-arriba);
}
#login h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:1.9rem;margin:0 0 4px;color:var(--uva)}
#login p{color:var(--suave);font-size:.94rem;margin:0 0 20px}
#login input{
  width:100%;padding:14px;margin-bottom:10px;border:1px solid var(--linea);
  border-radius:14px;font-size:1rem;font-family:inherit;background:var(--crema);color:var(--tinta);
  box-shadow:inset 0 1px 3px rgba(120,90,80,.07);
}
#login input:focus{outline:none;border-color:var(--blush);box-shadow:0 0 0 3px rgba(237,192,178,.35), inset 0 1px 3px rgba(120,90,80,.07)}
#login button{
  width:100%;padding:15px;border:none;border-radius:16px;
  background:radial-gradient(120% 100% at 30% 12%, var(--blush-luz) 0%, transparent 62%), var(--blush);
  color:#6B3A32;font-weight:800;font-size:1.03rem;cursor:pointer;font-family:inherit;
  box-shadow:
    0 1px 2px rgba(150,95,80,.18),
    0 6px 12px -3px rgba(150,95,80,.24),
    0 16px 26px -12px rgba(150,95,80,.30),
    inset 0 1.5px 0 rgba(255,255,255,.85);
}
#login button:active{transform:translateY(3px)}

main{max-width:520px;margin:0 auto;padding:16px 16px 40px}

/* ---------- la tarjeta de la foto pendiente ---------- */
.tarjeta{
  background:var(--papel);border:1px solid rgba(255,255,255,.9);border-radius:24px;
  overflow:hidden;box-shadow:var(--relieve-3), var(--luz-arriba);
}
.marco{position:relative;background:#EFE7E1}
.marco img{width:100%;max-height:58dvh;object-fit:contain;display:block}
.sello{
  position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:7px;
  background:rgba(255,253,251,.9);color:var(--tinta);border-radius:99px;
  padding:6px 13px;font-size:.78rem;font-weight:700;backdrop-filter:blur(4px);
  box-shadow:0 1px 2px rgba(90,60,55,.16), 0 4px 8px -3px rgba(90,60,55,.24);
}
.sello .pto{width:7px;height:7px;border-radius:50%;background:var(--blush-hondo)}
.quien{
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;border-bottom:1px solid var(--linea);
}
.quien .nom{font-weight:700;font-size:1rem}
.quien .meta{font-size:.76rem;color:var(--suave);margin-top:1px}
.quien .filtro{
  font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap;
}
.filtro.limpia{background:#E9F1EC;color:var(--ok)}
.filtro.rota{background:#FDF0F0;color:var(--rojo)}

/* LOS DOS BOTONES DE DECIDIR. Tienen que verse DISTINTOS. */
.acciones{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:12px;background:transparent}
.acciones button{
  border:none;border-radius:16px;padding:19px 10px;font-size:1.05rem;font-weight:800;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s ease;
}
.acciones button:active{transform:translateY(3px)}
.b-ok{
  background:radial-gradient(120% 100% at 30% 12%, #8FBBA3 0%, transparent 62%), var(--ok);
  color:#fff;
  box-shadow:
    0 1px 2px rgba(50,90,70,.20),
    0 6px 12px -3px rgba(50,90,70,.26),
    0 16px 26px -12px rgba(50,90,70,.32),
    inset 0 1.5px 0 rgba(255,255,255,.45),
    inset 0 -2px 4px rgba(40,75,58,.24);
}
.b-ok:active{box-shadow:0 1px 2px rgba(50,90,70,.22), inset 0 1.5px 0 rgba(255,255,255,.35)}
.b-no{
  background:linear-gradient(158deg,#FFFDFB,#F2ECE7);
  color:var(--no);border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--relieve-1), var(--luz-arriba);
}
.b-no:active{box-shadow:none}

/* ---------- vista en vivo ---------- */
.grilla-vivo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grilla-vivo .celda{
  position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;
  background:var(--linea);box-shadow:var(--relieve-2);
}
.grilla-vivo .celda::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 0 0 1px rgba(120,90,80,.07);
}
.grilla-vivo img{width:100%;height:100%;object-fit:cover;display:block}
/* el botón de pánico sigue rojo: es un control de seguridad */
.b-panico{
  position:absolute;left:0;right:0;bottom:0;width:100%;border:none;z-index:3;
  background:linear-gradient(to top, rgba(163,36,47,.94), rgba(163,36,47,.6));
  color:#fff;padding:8px 4px;font-size:.68rem;font-weight:800;cursor:pointer;
  font-family:inherit;letter-spacing:.06em;
}

/* ---------- vacíos ---------- */
.vacio{
  text-align:center;color:var(--suave);padding:52px 24px;
  background:var(--papel);border:1px solid rgba(255,255,255,.9);border-radius:24px;
  box-shadow:var(--relieve-2), var(--luz-arriba);
}
.vacio .grande{font-size:2.4rem;margin-bottom:10px;line-height:1;color:var(--blush-hondo)}
.vacio strong{display:block;color:var(--uva);font-size:1.05rem;margin-bottom:4px}
[hidden]{display:none!important}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-check"><path d="M5 12.5l4.5 4.5L19 7"/></g>
  <g id="i-x"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></g>
  <g id="i-reloj"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g>
  <g id="i-cartel"><rect x="4.5" y="3" width="15" height="18" rx="2"/><path d="M8.5 8h7"/><path d="M8.5 12h7"/><path d="M8.5 16h4"/></g>
  <g id="i-pantalla"><rect x="2.6" y="4" width="18.8" height="12.6" rx="2"/><path d="M8.5 20.3h7"/><path d="M12 16.6v3.7"/></g>
  <g id="i-ojo"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></g>
</defs></svg>

<header id="cabecera" hidden>
  <div class="hd-fila">
    <div class="hd-tit">
      <span class="ojal">Moderación</span>
      <h1 id="ev-nombre">Galería</h1>
    </div>
    <div class="hd-uso" id="hd-uso"></div>
    <a id="btn-cartel" class="hd-pantalla" target="_blank" rel="noopener" hidden>
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-cartel"/></svg>
      <span>Cartel<br>para imprimir</span>
    </a>
    <a id="btn-pantalla" class="hd-pantalla" target="_blank" rel="noopener" hidden>
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-pantalla"/></svg>
      <span>Pantalla<br>del salón</span>
    </a>
  </div>
  <nav class="tabs">
    <button id="tab-pend" class="activa" type="button">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-reloj"/></svg>
      Esperando <span class="pastilla" id="n-pend">0</span>
    </button>
    <button id="tab-vivo" type="button">
      <svg class="ico" viewBox="0 0 24 24"><use href="#i-ojo"/></svg>
      En pantalla <span class="pastilla" id="n-vivo">0</span>
    </button>
  </nav>
</header>

<div id="login" hidden>
  <div class="caja">
    <h2>Moderación</h2>
    <p>Entrá con tu cuenta, la misma con la que creaste la galería.</p>
    <input id="lg-mail" type="email" placeholder="Email" autocomplete="username">
    <input id="lg-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="lg-ok" type="button">Entrar</button>
    <p id="lg-error" style="color:#A3242F;margin:14px 0 0" hidden></p>
  </div>
</div>

<div id="estado"><p>Cargando…</p></div>

<main id="panel" hidden>
  <section id="vista-pend"></section>
  <section id="vista-vivo" class="grilla-vivo" hidden></section>
  <div id="sin-nada" class="vacio" hidden></div>
</main>

<script type="module">
const WORKER = 'https://galeria.littlemomentsok.workers.dev';

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, query, where, onSnapshot, doc, getDoc, updateDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const app = initializeApp({
  apiKey: 'AIzaSyBXWZc9xdpXx7HCkJfxcyofgI00buNlIXc',
  authDomain: 'invitame-9b51f.firebaseapp.com',
  projectId: 'invitame-9b51f'
}, 'gal-mod');
const db = getFirestore(app), auth = getAuth(app);

const $ = (id) => document.getElementById(id);
const GID = new URLSearchParams(location.search).get('g') || '';

if (!GID) {
  $('estado').innerHTML = '<p>Falta el evento. Abrí este panel desde el link que termina en <code>?g=…</code></p>';
} else {
  setPersistence(auth, browserLocalPersistence).catch(() => {});
  onAuthStateChanged(auth, (u) => {
    if (u) { $('login').hidden = true; $('estado').hidden = true; arrancar(); }
    else { $('estado').hidden = true; $('login').hidden = false; }
  });
  const entrar = async () => {
    $('lg-error').hidden = true;
    try { await signInWithEmailAndPassword(auth, $('lg-mail').value.trim(), $('lg-pass').value); }
    catch (e) {
      $('lg-error').textContent = 'No se pudo entrar. Revisá el mail y la contraseña.';
      $('lg-error').hidden = false;
    }
  };
  $('lg-ok').onclick = entrar;
  $('lg-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
}

let pendientes = [], aprobadas = [], vista = 'pend';

/* Los uid que pueden moderar CUALQUIER fiesta (Maki). No es un secreto:
   un uid solo no sirve para nada sin la sesión de esa persona. Hace falta
   porque las fiestas que crea ella con la clave del Worker quedan sin dueño. */
const ADMINS = ['gokxWGUaw3e3NBWjeCpYUXaZdY03'];

function noPasa(txt) {
  $('cabecera').hidden = true;
  $('panel').hidden = true;
  $('estado').hidden = false;
  $('estado').innerHTML = '<p>' + esc(txt) + '</p>' +
    '<p><button id="salir-mod" type="button">Salir y entrar con otra cuenta</button></p>';
  const b = $('salir-mod');
  if (b) b.onclick = () => signOut(auth).then(() => location.reload());
}

async function arrancar() {
  /* ⚠️ ¿Esta fiesta es de quien entró?
     El gid viaja en el link que el cliente le pasa a TODOS los invitados.
     Sin esta pregunta, cualquiera con cuenta abre moderar.html?g=<gid> y
     aprueba, rechaza o borra las fotos de la fiesta de otro. */
  let ev = null;
  try {
    const s = await getDoc(doc(db, 'gal_eventos', GID));
    if (s.exists()) ev = s.data();
  } catch (e) {
    return noPasa('No pudimos comprobar de quién es esta fiesta. Probá de nuevo en un momento.');
  }
  if (!ev) return noPasa('Esta galería no existe, o el link está incompleto.');

  const yo = (auth.currentUser && auth.currentUser.uid) || '';
  const esDuenio = !!ev.duenio && ev.duenio === yo;
  const esAdmin = ADMINS.indexOf(yo) >= 0;
  if (!esDuenio && !esAdmin) {
    return noPasa('Esta galería no es de tu cuenta. Entrá con la cuenta con la que la creaste.');
  }

  $('cabecera').hidden = false; $('panel').hidden = false;
  $('estado').hidden = true;

  $('ev-nombre').textContent = ev.nombre || 'Galería';
  if (ev.marca && ev.marca.color)
    document.documentElement.style.setProperty('--rosa', ev.marca.color);

  const bp = $('btn-pantalla');
  bp.href = 'pantalla.html?g=' + encodeURIComponent(GID);
  bp.hidden = false;
  const bc = $('btn-cartel');
  bc.href = 'cartel.html?g=' + encodeURIComponent(GID);
  bc.hidden = false;

  fetch(WORKER + '/uso').then(r => r.json()).then(u => {
    $('hd-uso').innerHTML = u.porcentaje + '% del espacio<br>' +
      u.quedanFotos.toLocaleString('es-AR') + ' fotos libres';
  }).catch(() => {});

  const col = collection(db, 'gal_fotos', GID, 'items');
  onSnapshot(query(col, where('estado', '==', 'pendiente')), (s) => {
    pendientes = docsDe(s, 1); pintar();
  }, avisarError);
  onSnapshot(query(col, where('estado', '==', 'aprobada')), (s) => {
    aprobadas = docsDe(s, -1); pintar();
  }, avisarError);

  $('tab-pend').onclick = () => { vista = 'pend'; pintar(); };
  $('tab-vivo').onclick = () => { vista = 'vivo'; pintar(); };
}

function avisarError(e) {
  $('estado').hidden = false;
  $('estado').innerHTML = '<p>No se pudo leer la galería (' + ((e && e.code) || 'error') + ').</p>';
}
function docsDe(s, orden) {
  const a = [];
  s.forEach((d) => a.push(Object.assign({ id: d.id }, d.data())));
  a.sort((x, y) => ((x.tsms || 0) - (y.tsms || 0)) * orden);
  return a;
}
async function cambiar(fid, estado) {
  try { await updateDoc(doc(db, 'gal_fotos', GID, 'items', fid), { estado }); }
  catch (e) {
    /* Nada de alert(): un cartel del navegador congela la página.
       Si el motivo es de permisos, decirlo con todas las letras. */
    const c = (e && e.code) || '';
    avisarError(/permission/i.test(c)
      ? { code: 'no es tu galería' }
      : { code: c || 'error' });
  }
}
function esc(s) {
  return String(s || '').replace(/[<>&"]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}
function haceRato(ts) {
  const min = Math.round((Date.now() - (ts || 0)) / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return 'hace ' + min + ' min';
  return 'hace ' + Math.round(min / 60) + ' h';
}

function pintar() {
  $('n-pend').textContent = pendientes.length;
  $('n-vivo').textContent = aprobadas.length;
  document.title = (pendientes.length ? '(' + pendientes.length + ') ' : '') + 'Moderar galería';
  $('tab-pend').classList.toggle('activa', vista === 'pend');
  $('tab-vivo').classList.toggle('activa', vista === 'vivo');
  $('vista-pend').hidden = vista !== 'pend';
  $('vista-vivo').hidden = vista !== 'vivo';

  if (vista === 'pend') pintarPendiente(); else pintarVivo();
}

function pintarPendiente() {
  const f = pendientes[0];
  if (!f) {
    $('vista-pend').innerHTML = '';
    sinNada('<div class="grande">✓</div><strong>No hay nada esperando</strong>Todo lo que subieron ya pasó por acá.');
    return;
  }
  sinNada(null);
  const filtro = f.mod && f.mod.falla
    ? '<span class="filtro rota">filtro sin respuesta</span>'
    : (f.mod && typeof f.mod.score === 'number'
        ? '<span class="filtro limpia">filtro OK · ' + Math.round(f.mod.score * 100) + '%</span>'
        : '');
  $('vista-pend').innerHTML =
    '<div class="tarjeta">' +
      '<div class="marco">' +
        '<img src="' + WORKER + '/f/' + f.r2.key + '" alt="Foto esperando aprobación">' +
        '<span class="sello"><span class="pto"></span>' +
          (pendientes.length > 1 ? pendientes.length + ' esperando' : 'esperando') + '</span>' +
      '</div>' +
      '<div class="quien">' +
        '<div><div class="nom">' + esc((f.autor && f.autor.nombre) || 'Invitado') + '</div>' +
        '<div class="meta">' + haceRato(f.tsms) + ' · ' +
          ((f.autor && f.autor.origen === 'invitacion') ? 'desde la invitación' : 'desde el QR') +
        '</div></div>' + filtro +
      '</div>' +
      '<div class="acciones">' +
        '<button class="b-no" id="b-no" type="button">' +
          '<svg class="ico" viewBox="0 0 24 24"><use href="#i-x"/></svg>No va</button>' +
        '<button class="b-ok" id="b-ok" type="button">' +
          '<svg class="ico" viewBox="0 0 24 24"><use href="#i-check"/></svg>A pantalla</button>' +
      '</div>' +
    '</div>';
  $('b-ok').onclick = () => cambiar(f.id, 'aprobada');
  $('b-no').onclick = () => cambiar(f.id, 'rechazada');
}

function pintarVivo() {
  if (!aprobadas.length) {
    $('vista-vivo').innerHTML = '';
    sinNada('<div class="grande">◌</div><strong>Todavía no hay fotos en pantalla</strong>Las que apruebes aparecen acá.');
    return;
  }
  sinNada(null);
  $('vista-vivo').innerHTML = aprobadas.map((f) =>
    '<div class="celda">' +
      '<img loading="lazy" src="' + WORKER + '/f/' + f.r2.thumb + '" alt="">' +
      '<button class="b-panico" data-fid="' + f.id + '" type="button">BAJAR</button>' +
    '</div>').join('');
  $('vista-vivo').querySelectorAll('.b-panico').forEach((b) => {
    b.onclick = () => cambiar(b.dataset.fid, 'borrada');   // sin confirm: los diálogos nativos cuelgan
  });
}

function sinNada(html) {
  $('sin-nada').hidden = !html;
  if (html) $('sin-nada').innerHTML = html;
}
</script>
</body>
</html>
