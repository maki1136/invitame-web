<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cartel para imprimir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Nunito:wght@400;600;700;800&display=swap">

<!-- ============================================================
     EL CARTEL DE LAS MESAS · para imprimir

     Dos formatos, el mismo link:
       ?g=<código>                → una hoja A4 para el atril o la mesa
       ?g=<código>&modo=tarjetas  → seis tarjetitas recortables en una A4

     EL QR SE DIBUJA ACÁ ADENTRO (ver qr.js). No se le pide a nadie.

     EL DISEÑO, copiado de la referencia que pasó Maki:
     · Todo claro sobre claro. El contraste no hace el trabajo: lo hace
       la sombra. Nada de bloques de color fuerte.
     · Relieve en capas: contacto duro pegado al objeto + sombra larga
       y suave lejos. Es lo que hace que una tarjeta "flote".
     · Las esferas blush con luz arriba a la izquierda y sombra
       proyectada abajo a la derecha, siempre en la misma dirección.
     · Props orgánicos (la ramita, las manchas) muy tenues, de fondo.
     · El uva queda SOLO para el texto: en papel tiene que leerse.
     ============================================================ -->
<style>
:root{
  /* la paleta de la referencia, con el uva de Invítame para el texto */
  --uva:#6D1233;
  --tinta:#4A3038;
  --suave:#9B8880;
  --crema:#FBF7F3;
  --greige:#C8BFB5;
  --blush:#EDC0B2;
  --blush-luz:#FBDFD5;
  --blush-hondo:#DDA292;

  /* LA LUZ VIENE DE ARRIBA A LA IZQUIERDA. Todas las sombras caen
     abajo a la derecha. Si una sola va para otro lado, se rompe. */
  --relieve-carta:
    0 1px 1px rgba(90,60,55,.05),
    0 3px 5px rgba(90,60,55,.05),
    0 9px 16px -4px rgba(90,60,55,.08),
    0 20px 32px -12px rgba(90,60,55,.12);
  --relieve-hoja:
    0 2px 4px rgba(70,50,45,.10),
    0 12px 24px -6px rgba(70,50,45,.14),
    0 40px 70px -20px rgba(70,50,45,.28);
  --luz-arriba:inset 0 1px 0 rgba(255,255,255,.9);
  --sombra-esfera:
    0 1px 2px rgba(120,80,70,.18),
    5px 7px 12px -2px rgba(120,80,70,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 22% 8%, #DDD5CC 0%, transparent 58%),
    linear-gradient(165deg, #CEC5BB 0%, #BDB2A7 100%);
  background-attachment:fixed;
  font-family:"Nunito",system-ui,-apple-system,sans-serif;
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
}

/* ---------- la barra flotante (no se imprime) ---------- */
.barra{
  position:sticky;top:0;z-index:10;
  margin:18px auto 0;max-width:210mm;
  background:rgba(255,253,251,.82);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:var(--relieve-carta), var(--luz-arriba);
}
.barra .t{flex:1;min-width:170px;font-weight:700;font-size:.9rem;line-height:1.3;padding-left:6px}
.barra .t span{display:block;font-weight:400;color:var(--suave);font-size:.86em}
.barra button, .barra a{
  border:none;border-radius:14px;padding:11px 20px;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:.9rem;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;
  transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s ease;
}
.b-imprimir{
  background:radial-gradient(120% 100% at 30% 12%, var(--blush-luz) 0%, transparent 62%), var(--blush);
  color:#6B3A32;
  box-shadow:
    0 1px 2px rgba(150,95,80,.20),
    0 6px 12px -3px rgba(150,95,80,.28),
    0 16px 26px -12px rgba(150,95,80,.35),
    inset 0 1.5px 0 rgba(255,255,255,.85),
    inset 0 -2px 4px rgba(180,120,105,.22);
}
.b-imprimir:active{transform:translateY(3px);box-shadow:0 1px 2px rgba(150,95,80,.22), inset 0 1.5px 0 rgba(255,255,255,.7)}
.b-otro{
  background:rgba(255,255,255,.72);color:var(--tinta);
  box-shadow:0 1px 2px rgba(90,60,55,.08), 0 4px 9px -3px rgba(90,60,55,.12), var(--luz-arriba);
}
.b-otro:active{transform:translateY(2px)}

/* ---------- la hoja ---------- */
.hoja{
  width:210mm;min-height:297mm;margin:26px auto;
  background:var(--crema);
  border-radius:4mm;
  box-shadow:var(--relieve-hoja);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20mm 18mm;text-align:center;
}
/* las manchas orgánicas del fondo, muy tenues: en papel más que esto
   ensucia y gasta tinta */
.hoja::before{
  content:"";position:absolute;inset:-14% -14% auto -14%;height:62%;
  background:
    radial-gradient(52% 46% at 26% 32%, rgba(237,192,178,.34), transparent 64%),
    radial-gradient(44% 38% at 82% 16%, rgba(214,196,186,.30), transparent 62%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 76%);
          mask-image:linear-gradient(to bottom,#000 0%,#000 42%,transparent 76%);
  pointer-events:none;
}
.hoja::after{
  content:"";position:absolute;left:-12%;right:-12%;bottom:-16%;height:46%;
  background:radial-gradient(56% 60% at 62% 82%, rgba(237,192,178,.24), transparent 68%);
  pointer-events:none;
}
.hoja > *{position:relative;z-index:1}

/* la ramita, como el coral de la referencia */
.rama{
  position:absolute;z-index:0;pointer-events:none;
  stroke:#D8CCC3;fill:none;stroke-width:.9;stroke-linecap:round;
  opacity:.85;
}
.rama-izq{left:6mm;top:26mm;width:26mm;height:52mm;transform:rotate(-8deg)}
.rama-der{right:5mm;bottom:22mm;width:24mm;height:48mm;transform:scaleX(-1) rotate(-6deg)}

/* ---------- la esfera del ícono ---------- */
.esfera{
  width:24mm;height:24mm;border-radius:50%;margin-bottom:7mm;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(66% 62% at 33% 27%, var(--blush-luz) 0%, var(--blush) 52%, var(--blush-hondo) 100%);
  box-shadow:var(--sombra-esfera),
    inset 0 1.4mm 0 rgba(255,255,255,.55),
    inset 0 -1.6mm 3mm rgba(170,110,95,.30);
  color:#fff;
}
.esfera svg{
  width:12mm;height:12mm;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 .4mm .6mm rgba(140,80,70,.35));
}

.ojal{
  font-size:3.3mm;letter-spacing:.26em;text-transform:uppercase;
  font-weight:700;color:var(--suave);margin-bottom:4mm;
}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:21mm;line-height:1.04;margin:0 0 5mm;color:var(--uva);
  max-width:15ch;text-wrap:balance;
}
.evento{
  font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:400;
  font-size:7.6mm;line-height:1.2;margin:0 0 9mm;color:var(--tinta);opacity:.66;
}

/* ---------- la tarjeta del QR: el objeto que flota ---------- */
.marco-qr{
  background:#fff;
  border:1px solid rgba(255,255,255,.95);
  border-radius:7mm;
  padding:6mm;margin-bottom:9mm;
  box-shadow:var(--relieve-carta), var(--luz-arriba);
}
.marco-qr .cuadro{width:74mm;height:74mm;display:block}
.marco-qr .cuadro canvas,.marco-qr .cuadro img{width:100%;height:100%;display:block}

/* ---------- los tres pasos ---------- */
.pasos{display:flex;gap:6mm;justify-content:center;margin-bottom:9mm;max-width:152mm}
.paso{flex:1;max-width:45mm}
.paso .n{
  width:10mm;height:10mm;border-radius:50%;
  background:radial-gradient(66% 62% at 33% 27%, var(--blush-luz) 0%, var(--blush) 55%, var(--blush-hondo) 100%);
  color:#7A4034;font-weight:800;font-size:4.4mm;
  display:flex;align-items:center;justify-content:center;margin:0 auto 3mm;
  box-shadow:
    0 .6mm 1mm rgba(140,90,78,.20),
    2mm 2.6mm 4mm -1mm rgba(140,90,78,.26),
    inset 0 .8mm 0 rgba(255,255,255,.7);
}
.paso p{margin:0;font-size:3.9mm;line-height:1.4;color:var(--tinta);opacity:.82}
.pie{
  font-size:3.2mm;letter-spacing:.22em;text-transform:uppercase;
  font-weight:700;color:var(--suave);
}
.pie b{color:var(--uva);font-weight:800}
#pie-marca{color:var(--uva);font-size:3.8mm;letter-spacing:.18em;margin-bottom:1.5mm}
#pie-logo{max-height:12mm;max-width:60mm;display:block;margin:0 auto 2mm}
.pie.chiquito{font-size:2.6mm;letter-spacing:.18em;opacity:.75}

/* ---------- las seis tarjetitas ---------- */
.tarjetas{
  background:var(--crema);border-radius:4mm;
  box-shadow:var(--relieve-hoja);
  margin:26px auto;position:relative;overflow:hidden;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);
  gap:0;padding:9mm;width:210mm;min-height:297mm;
}
.tarjeta{
  border:.25mm dashed #D6CAC1;border-radius:3mm;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:5mm;gap:1.5mm;
}
.tarjeta .tt{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:6.6mm;line-height:1.05;color:var(--uva);margin:0;
}
.tarjeta .ev{font-size:3.2mm;font-style:italic;color:var(--suave);margin:0 0 1mm}
.tarjeta .cuadro{
  width:33mm;height:33mm;display:block;margin:1mm 0;background:#fff;
  border-radius:2.5mm;padding:1.4mm;
  box-shadow:0 .4mm .8mm rgba(90,60,55,.08), 0 2mm 4mm -1mm rgba(90,60,55,.14);
}
.tarjeta .cuadro canvas,.tarjeta .cuadro img{width:100%;height:100%;display:block}
.tarjeta .ay{font-size:3mm;color:var(--tinta);margin:0;line-height:1.3;opacity:.72}
.tarjeta .mk{font-size:2.5mm;letter-spacing:.18em;text-transform:uppercase;
  font-weight:700;color:var(--suave);margin:1mm 0 0}

#aviso{
  max-width:210mm;margin:24px auto;padding:16px 20px;color:#7A3A3E;
  background:rgba(255,253,251,.86);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.9);border-radius:18px;font-size:.95rem;
  box-shadow:var(--relieve-carta);
}

/* ---------- en pantalla chica, la hoja se achica para verla entera ----------
   Solo en pantalla: al imprimir sale siempre en A4 real. */
@media screen and (max-width:900px){ .hoja,.tarjetas{ zoom:.62 } .barra{max-width:calc(100% - 24px)} }
@media screen and (max-width:620px){ .hoja,.tarjetas{ zoom:.44 } }
@media screen and (max-width:430px){ .hoja,.tarjetas{ zoom:.34 } }

/* ---------- imprimir ---------- */
@page{ size:A4; margin:0 }
@media print{
  body{background:#fff}
  .barra,#aviso{display:none!important}
  .hoja,.tarjetas{
    margin:0;box-shadow:none;border-radius:0;
    width:210mm;height:297mm;min-height:0;
    page-break-after:avoid;zoom:1;
  }
  /* que el navegador imprima los fondos de color */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="barra" id="barra">
  <div class="t" id="barra-t">Cartel para las mesas<span>Imprimilo en A4, sin márgenes</span></div>
  <a class="b-otro" id="b-modo" href="#">Ver las tarjetitas</a>
  <button class="b-imprimir" id="b-imprimir" type="button">Imprimir</button>
</div>

<div id="aviso" hidden></div>

<!-- ====== el cartel A4 ====== -->
<div class="hoja" id="hoja">

  <svg class="rama rama-izq" viewBox="0 0 60 120" aria-hidden="true">
    <path d="M30 118 C30 90 30 60 30 8"/>
    <path d="M30 96 C22 92 16 84 14 74"/><path d="M30 96 C38 92 44 84 46 74"/>
    <path d="M30 78 C23 74 18 67 16 58"/><path d="M30 78 C37 74 42 67 44 58"/>
    <path d="M30 60 C24 56 20 50 18 42"/><path d="M30 60 C36 56 40 50 42 42"/>
    <path d="M30 42 C25 38 22 33 21 27"/><path d="M30 42 C35 38 38 33 39 27"/>
    <path d="M30 26 C27 22 25 18 24 14"/><path d="M30 26 C33 22 35 18 36 14"/>
  </svg>
  <svg class="rama rama-der" viewBox="0 0 60 120" aria-hidden="true">
    <path d="M30 118 C30 92 30 62 30 10"/>
    <path d="M30 100 C21 96 15 87 13 77"/><path d="M30 100 C39 96 45 87 47 77"/>
    <path d="M30 80 C22 76 17 68 15 59"/><path d="M30 80 C38 76 43 68 45 59"/>
    <path d="M30 60 C24 56 20 49 18 41"/><path d="M30 60 C36 56 40 49 42 41"/>
    <path d="M30 40 C26 36 23 31 22 25"/><path d="M30 40 C34 36 37 31 38 25"/>
  </svg>

  <div class="esfera">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.8 3.7h4.4a1 1 0 0 1 .83.45l.94 1.4A1 1 0 0 0 16.8 6h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>
      <circle cx="12" cy="13" r="3.6"/>
    </svg>
  </div>

  <div class="ojal">Las fotos de la fiesta</div>
  <h1>Sacá tus fotos y subilas</h1>
  <p class="evento" id="ev-nombre">&nbsp;</p>

  <div class="marco-qr"><div class="cuadro" id="qr-grande"></div></div>

  <div class="pasos">
    <div class="paso"><div class="n">1</div><p>Abrí la cámara del celular y apuntá al código</p></div>
    <div class="paso"><div class="n">2</div><p>Poné tu nombre, para que la foto lleve tu firma</p></div>
    <div class="paso"><div class="n">3</div><p>Sacá fotos toda la noche y mirá las de todos</p></div>
  </div>

  <!-- La marca del estudio arriba, protagonista; la nuestra abajo en chico.
       Si el fotógrafo no puso ninguna, queda sólo «Hecho con Invítame» y el
       cartel se ve exactamente como antes. -->
  <img id="pie-logo" alt="" hidden>
  <div class="pie" id="pie-marca" hidden></div>
  <div class="pie chiquito">Hecho con <b>Invítame</b></div>
</div>

<!-- ====== las seis tarjetitas ====== -->
<div class="tarjetas" id="tarjetas" hidden></div>

<script type="module">
import { dibujarQR } from './qr.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const GID = (params.get('g') || '').trim();
const MODO = params.get('modo') === 'tarjetas' ? 'tarjetas' : 'cartel';
const BASE = 'https://invitame.littlemomentsok.com';

if (!/^[A-Za-z0-9_-]{16,64}$/.test(GID)) {
  $('hoja').hidden = true;
  $('barra').hidden = true;
  $('aviso').hidden = false;
  $('aviso').textContent =
    'Falta el código del evento. Este cartel se abre desde el panel, con el link que termina en ?g= y el código de la fiesta.';
} else {
  preparar();
}

async function preparar() {
  const destino = BASE + '/galeria/?g=' + encodeURIComponent(GID);

  /* el otro formato, sin perder el código */
  const otro = MODO === 'cartel' ? 'tarjetas' : 'cartel';
  $('b-modo').href = '?g=' + encodeURIComponent(GID) + (otro === 'tarjetas' ? '&modo=tarjetas' : '');
  $('b-modo').textContent = otro === 'tarjetas' ? 'Ver las tarjetitas' : 'Ver el cartel grande';

  if (MODO === 'tarjetas') {
    $('hoja').hidden = true;
    $('tarjetas').hidden = false;
    $('barra-t').innerHTML = 'Tarjetitas para las mesas<span>Seis por hoja, se recortan por la línea de puntos</span>';
    armarTarjetas('');
  }

  /* El QR primero: es lo único imprescindible del cartel.
     900 px para que impreso a 74 mm quede muy por encima de lo que
     necesita cualquier cámara. */
  if (MODO === 'cartel') {
    await dibujarQR($('qr-grande'), destino, 900, GID);
  } else {
    for (const c of document.querySelectorAll('#tarjetas .cuadro')) {
      await dibujarQR(c, destino, 500, GID);
    }
  }

  /* El nombre de la fiesta. Si no se puede leer, el cartel sale igual. */
  cargarNombre().catch(() => {});

  /* Antes de imprimir esperamos a las tipografías. Si no, sale con la
     tipografía de repuesto y el cartel queda con otra cara. */
  $('b-imprimir').onclick = async () => {
    try { await document.fonts.ready; } catch (e) {}
    window.print();
  };
}

async function cargarNombre() {
  const { initializeApp } =
    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getFirestore, doc, getDoc } =
    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const app = initializeApp({
    apiKey: 'AIzaSyBXWZc9xdpXx7HCkJfxcyofgI00buNlIXc',
    authDomain: 'invitame-9b51f.firebaseapp.com',
    projectId: 'invitame-9b51f'
  }, 'cartel');
  const s = await getDoc(doc(getFirestore(app), 'gal_eventos', GID));
  if (!s.exists()) return;
  const ev = s.data() || {};

  /* La marca del estudio. Va aparte del nombre a propósito: si la fiesta no
     tiene nombre, el cartel igual tiene que salir con la marca, y al revés. */
  pintarMarca(ev.marca || {});

  const nombre = ev.nombre || '';
  if (!nombre) return;
  $('ev-nombre').textContent = nombre;
  document.title = 'Cartel · ' + nombre;
  document.querySelectorAll('#tarjetas .ev').forEach((e) => { e.textContent = nombre; });
}

/* 'Invítame' es el valor de fábrica del Worker, no una marca que el fotógrafo
   haya elegido: si viene ése, no se muestra nada arriba y queda sólo el
   «Hecho con Invítame» de abajo. Si se mostrara, el cartel diría Invítame dos
   veces. */
function pintarMarca(m) {
  const txt = String(m.texto || '').trim();
  if (txt && txt !== 'Invítame') {
    $('pie-marca').textContent = txt;
    $('pie-marca').hidden = false;
    document.querySelectorAll('#tarjetas .mk').forEach((e) => { e.textContent = txt; });
  }
  if (m.logo) {
    const img = $('pie-logo');
    /* Si el logo no carga (borrado, sin internet en la imprenta), se esconde y
       el cartel sale igual. Un cuadrado roto impreso en 20 mesas es peor que
       no tener logo. */
    img.onerror = () => { img.hidden = true; };
    img.onload = () => { img.hidden = false; };
    img.src = m.logo;
  }
  if (/^#[0-9a-fA-F]{6}$/.test(String(m.color || ''))) {
    document.documentElement.style.setProperty('--uva', m.color);
  }
}

function armarTarjetas(nombre) {
  const c = $('tarjetas');
  c.textContent = '';
  for (let i = 0; i < 6; i++) {
    const t = document.createElement('div');
    t.className = 'tarjeta';

    const h = document.createElement('p');
    h.className = 'tt';
    h.textContent = 'Sacá tus fotos';
    t.appendChild(h);

    const e = document.createElement('p');
    e.className = 'ev';
    e.textContent = nombre;
    t.appendChild(e);

    const cua = document.createElement('div');
    cua.className = 'cuadro';
    t.appendChild(cua);

    const a = document.createElement('p');
    a.className = 'ay';
    a.textContent = 'Apuntá con la cámara del celular';
    t.appendChild(a);

    const m = document.createElement('p');
    m.className = 'mk';
    m.textContent = 'Invítame';
    t.appendChild(m);

    c.appendChild(t);
  }
}
</script>
</body>
</html>
