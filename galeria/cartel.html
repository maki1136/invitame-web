<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cartel para imprimir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap">

<!-- ============================================================
     EL CARTEL DE LAS MESAS · para imprimir

     Dos formatos, el mismo link:
       ?g=<código>                → una hoja A4 para el atril o la mesa
       ?g=<código>&modo=tarjetas  → seis tarjetitas recortables en una A4

     Se abre desde el panel de la invitación y desde el panel de moderar,
     así lo puede imprimir tanto Maki como los novios.

     Todo el color es de fondo: se imprime en cualquier impresora
     hogareña. Nada de tinta a sangre ni negros pesados.
     ============================================================ -->
<style>
:root{
  --uva:#6D1233;
  --rosa:#F56770;
  --caracol:#F9F3EF;
  --tinta:#3A2029;
  --suave:#8C7078;
  --acento:#F56770;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#E7E1DD;
  font-family:"Nunito",system-ui,-apple-system,sans-serif;
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
}

/* ---------- la barra de arriba (no se imprime) ---------- */
.barra{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(160deg,#7E1A3D,#5A0E29);color:#fff;
  padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 6px 20px -12px rgba(58,16,32,.7);
}
.barra .t{flex:1;min-width:180px;font-weight:700;font-size:.95rem;line-height:1.3}
.barra .t span{display:block;font-weight:400;opacity:.7;font-size:.85em}
.barra button, .barra a{
  border:none;border-radius:12px;padding:12px 20px;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:.92rem;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;
}
.b-imprimir{
  background:radial-gradient(120% 100% at 30% 0%, #FF8992 0%, transparent 60%), var(--acento);
  color:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.22), 0 10px 20px -8px rgba(0,0,0,.4),
    inset 0 1.5px 0 rgba(255,255,255,.45);
}
.b-imprimir:active{transform:translateY(2px)}
.b-otro{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22)}

/* ---------- la hoja ---------- */
.hoja{
  width:210mm;min-height:297mm;margin:26px auto;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12), 0 24px 60px -20px rgba(0,0,0,.35);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22mm 18mm;text-align:center;
}
/* la mancha orgánica de la marca, dibujada con degradados */
.hoja::before{
  content:"";position:absolute;inset:-20% -10% auto -10%;height:75%;
  background:
    radial-gradient(58% 46% at 24% 34%, rgba(245,103,112,.20), transparent 62%),
    radial-gradient(50% 40% at 80% 20%, rgba(109,18,51,.15), transparent 60%);
  -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 45%, transparent 72%);
          mask-image:linear-gradient(to bottom, #000 0%, #000 45%, transparent 72%);
  pointer-events:none;
}
.hoja::after{
  content:"";position:absolute;inset:-10% -10% -20% -10%;height:60%;top:auto;
  background:radial-gradient(60% 50% at 50% 90%, rgba(109,18,51,.10), transparent 68%);
  pointer-events:none;
}
.hoja > *{position:relative}

.ico-disco{
  width:26mm;height:26mm;border-radius:50%;margin-bottom:8mm;
  display:flex;align-items:center;justify-content:center;
  background:var(--uva);color:#fff;
}
.ico-disco svg{width:14mm;height:14mm;fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round}

.ojal{
  font-size:3.6mm;letter-spacing:.24em;text-transform:uppercase;
  font-weight:800;color:var(--suave);margin-bottom:4mm;
}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:22mm;line-height:1.02;margin:0 0 5mm;color:var(--uva);
  max-width:16ch;text-wrap:balance;
}
.evento{
  font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
  font-size:8mm;line-height:1.2;margin:0 0 9mm;color:var(--tinta);opacity:.72;
}
.marco-qr{
  background:#fff;border:1.2mm solid var(--uva);border-radius:6mm;
  padding:5mm;margin-bottom:9mm;
}
.marco-qr img{display:block;width:78mm;height:78mm}
.pasos{
  display:flex;gap:7mm;justify-content:center;margin-bottom:10mm;
  max-width:150mm;
}
.paso{flex:1;max-width:44mm}
.paso .n{
  width:9mm;height:9mm;border-radius:50%;background:var(--acento);color:#fff;
  font-weight:800;font-size:4.6mm;display:flex;align-items:center;justify-content:center;
  margin:0 auto 3mm;
}
.paso p{margin:0;font-size:4mm;line-height:1.35;color:var(--tinta)}
.pie{
  font-size:3.4mm;letter-spacing:.2em;text-transform:uppercase;
  font-weight:700;color:var(--suave);
}
.pie b{color:var(--uva)}

/* ---------- las seis tarjetitas ---------- */
.tarjetas{
  /* fondo blanco propio: si no, al imprimir sale el gris del escritorio */
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12), 0 24px 60px -20px rgba(0,0,0,.35);
  margin:26px auto;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);
  gap:0;padding:10mm;width:210mm;min-height:297mm;
}
.tarjeta{
  border:.3mm dashed #C9BDB7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:6mm;gap:2mm;
}
.tarjeta .tt{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;
  font-size:7mm;line-height:1.05;color:var(--uva);margin:0;
}
.tarjeta .ev{font-size:3.4mm;font-style:italic;color:var(--suave);margin:0 0 1mm}
.tarjeta img{width:36mm;height:36mm;display:block;margin:1mm 0}
.tarjeta .ay{font-size:3.2mm;color:var(--tinta);margin:0;line-height:1.3;opacity:.8}
.tarjeta .mk{font-size:2.6mm;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;color:var(--suave);margin:1mm 0 0}

#aviso{max-width:210mm;margin:0 auto;padding:14px 18px;color:#7A2A34;
  background:#FDEFF0;border:1px solid #F0CBCE;border-radius:12px;font-size:.95rem}

/* ---------- en pantalla chica, la hoja se achica para verla entera ----------
   Solo en pantalla: al imprimir sale siempre en A4 real. */
@media screen and (max-width:900px){
  .hoja,.tarjetas{ zoom:.62 }
}
@media screen and (max-width:620px){
  .hoja,.tarjetas{ zoom:.44 }
}
@media screen and (max-width:430px){
  .hoja,.tarjetas{ zoom:.34 }
}

/* ---------- imprimir ---------- */
@page{ size:A4; margin:0 }
@media print{
  body{background:#fff}
  .barra,#aviso{display:none!important}
  .hoja,.tarjetas{
    margin:0;box-shadow:none;width:210mm;height:297mm;min-height:0;
    page-break-after:avoid;zoom:1;
  }
  /* que el navegador imprima los fondos de color */
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="barra" id="barra">
  <div class="t" id="barra-t">Cartel para las mesas<span>Imprimilo en A4, sin márgenes</span></div>
  <a class="b-otro" id="b-modo" href="#">Ver las tarjetitas</a>
  <button class="b-imprimir" id="b-imprimir" type="button">Imprimir</button>
</div>

<div id="aviso" hidden></div>

<!-- ====== el cartel A4 ====== -->
<div class="hoja" id="hoja">
  <div class="ico-disco">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.8 3.7h4.4a1 1 0 0 1 .83.45l.94 1.4A1 1 0 0 0 16.8 6h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/>
      <circle cx="12" cy="13" r="3.6"/>
    </svg>
  </div>
  <div class="ojal">Las fotos de la fiesta</div>
  <h1>Sacá tus fotos y subilas</h1>
  <p class="evento" id="ev-nombre">&nbsp;</p>
  <div class="marco-qr"><img id="qr-grande" alt="Código QR para subir las fotos"></div>
  <div class="pasos">
    <div class="paso"><div class="n">1</div><p>Abrí la cámara del celular y apuntá al código</p></div>
    <div class="paso"><div class="n">2</div><p>Poné tu nombre, para que la foto lleve tu firma</p></div>
    <div class="paso"><div class="n">3</div><p>Sacá fotos toda la noche y mirá las de todos</p></div>
  </div>
  <div class="pie">Hecho con <b>Invítame</b></div>
</div>

<!-- ====== las seis tarjetitas ====== -->
<div class="tarjetas" id="tarjetas" hidden></div>

<script type="module">
const WORKER = 'https://galeria.littlemomentsok.workers.dev';
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const GID = (params.get('g') || '').trim();
const MODO = params.get('modo') === 'tarjetas' ? 'tarjetas' : 'cartel';

if (!/^[A-Za-z0-9_-]{16,64}$/.test(GID)) {
  $('hoja').hidden = true;
  $('barra').hidden = true;
  $('aviso').hidden = false;
  $('aviso').textContent =
    'Falta el código del evento. Este cartel se abre desde el panel, con el link que termina en ?g= y el código de la fiesta.';
} else {
  preparar();
}

function preparar() {
  const urlQR = WORKER + '/qr?g=' + encodeURIComponent(GID);
  $('qr-grande').src = urlQR;

  /* el otro formato, sin perder el código */
  const otro = MODO === 'cartel' ? 'tarjetas' : 'cartel';
  $('b-modo').href = '?g=' + encodeURIComponent(GID) + (otro === 'tarjetas' ? '&modo=tarjetas' : '');
  $('b-modo').textContent = otro === 'tarjetas' ? 'Ver las tarjetitas' : 'Ver el cartel grande';

  if (MODO === 'tarjetas') {
    $('hoja').hidden = true;
    $('tarjetas').hidden = false;
    $('barra-t').innerHTML = 'Tarjetitas para las mesas<span>Seis por hoja, se recortan por la línea de puntos</span>';
    pintarTarjetas('', urlQR);
  }

  /* El nombre de la fiesta. Si no se puede leer, el cartel sale igual:
     el QR es lo único imprescindible. */
  cargarNombre().catch(() => {});

  /* Antes de imprimir esperamos a las tipografías. Si no, sale con la
     tipografía de repuesto y el cartel queda con otra cara. */
  $('b-imprimir').onclick = async () => {
    try { await document.fonts.ready; } catch (e) {}
    window.print();
  };
}

async function cargarNombre() {
  const { initializeApp } =
    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  const { getFirestore, doc, getDoc } =
    await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
  const app = initializeApp({
    apiKey: 'AIzaSyBXWZc9xdpXx7HCkJfxcyofgI00buNlIXc',
    authDomain: 'invitame-9b51f.firebaseapp.com',
    projectId: 'invitame-9b51f'
  }, 'cartel');
  const s = await getDoc(doc(getFirestore(app), 'gal_eventos', GID));
  if (!s.exists()) return;
  const ev = s.data();
  const nombre = ev.nombre || '';
  if (ev.marca && ev.marca.color) {
    document.documentElement.style.setProperty('--acento', ev.marca.color);
  }
  if (nombre) {
    $('ev-nombre').textContent = nombre;
    document.title = 'Cartel · ' + nombre;
    if (MODO === 'tarjetas') pintarTarjetas(nombre, WORKER + '/qr?g=' + encodeURIComponent(GID));
  }
}

function pintarTarjetas(nombre, urlQR) {
  const c = $('tarjetas');
  c.textContent = '';
  for (let i = 0; i < 6; i++) {
    const t = document.createElement('div');
    t.className = 'tarjeta';

    const h = document.createElement('p');
    h.className = 'tt';
    h.textContent = 'Sacá tus fotos';
    t.appendChild(h);

    if (nombre) {
      const e = document.createElement('p');
      e.className = 'ev';
      e.textContent = nombre;
      t.appendChild(e);
    }

    const img = document.createElement('img');
    img.src = urlQR;
    img.alt = 'Código QR para subir las fotos';
    t.appendChild(img);

    const a = document.createElement('p');
    a.className = 'ay';
    a.textContent = 'Apuntá con la cámara del celular';
    t.appendChild(a);

    const m = document.createElement('p');
    m.className = 'mk';
    m.textContent = 'Invítame';
    t.appendChild(m);

    c.appendChild(t);
  }
}
</script>
</body>
</html>
