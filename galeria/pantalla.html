<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1A0710">
<title>Pantalla del salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">

<!-- ============================================================
     PANTALLA DEL SALÓN · las fotos de los invitados en el proyector

     Este archivo va SOLO, todo adentro (estilos y código). Es a
     propósito: la pantalla del salón se abre una vez, a veces con
     el wifi del salón funcionando mal, y cuantos menos archivos
     tenga que bajar, menos cosas pueden fallar esa noche.

     Lo que hace:
     · Pasa en bucle las fotos APROBADAS, a pantalla completa.
     · Se entera sola cuando aprobás una foto nueva: entra al bucle
       sin recargar nada.
     · Si sacás una foto con el botón de pánico, DESAPARECE al
       instante, aunque sea la que está en pantalla en ese momento.
     · Guarda cada foto en la caché del navegador. Si se cae el wifi
       del salón, la pantalla sigue pasando fotos como si nada.
     · Cada tanto muestra el QR grande para que los invitados que
       recién llegan sepan cómo subir las suyas.
     · Le pide al navegador que no apague la pantalla (Wake Lock).
     · Anda igual en 16:9 y en 9:16: la pantalla del salón puede ser
       un proyector acostado o una pantalla parada.

     Se abre así:  /galeria/pantalla.html?g=<código del evento>
     ============================================================ -->
<style>
:root{
  --uva:#6D1233;
  --rosa:#F56770;
  --caracol:#F9F3EF;
  --acento:#F56770;
  --fondo:#1A0710;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--fondo)}
body{
  font-family:"Nunito",system-ui,-apple-system,sans-serif;
  color:#fff;cursor:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0}

/* ---------- el escenario ---------- */
#escena{position:fixed;inset:0}

/* El fondo: la misma foto, agrandada y desenfocada. Llena la pantalla
   sin recortar la foto de verdad y sin dejar dos barras negras. */
.capa{
  position:absolute;inset:0;opacity:0;
  transition:opacity 1.4s ease;
  /* La foto se acomoda DENTRO de este margen. La franja de abajo es de la
     firma y del cartelito del QR. (El fondo y el velo son absolutos: no
     los afecta.)

     Hay DOS casos y no se resuelven igual. Lo puso Maki: la pantalla del
     salón puede ser 16:9 o 9:16.

     · Foto ANCHA para la pantalla (una horizontal en el proyector, o
       cualquiera en una pantalla vertical): llega hasta los costados, así
       que sí o sí hay que reservarle la franja de abajo.
     · Foto ALTA para la pantalla (la vertical del celular en un proyector
       16:9, que es EL caso más común en una fiesta): queda angosta y
       centrada, no llega ni al QR ni a la firma. Reservarle la franja de
       abajo era regalarle un tercio del alto sin motivo.
       Medido: pasaba del 13% al 23% de la pantalla.

     El código de abajo le pone la clase mirando la foto y la pantalla. */
  display:flex;align-items:center;justify-content:center;
  padding:4% 7% 17% 7%;
}
/* La franja se achica SÓLO en pantallas bien anchas (16:9 para arriba),
   que es donde la foto vertical queda angosta y lejos del QR. En una TV
   4:3 la misma foto sale más ancha en proporción y llega a rozarlo:
   medido, se tocaban por 2 px. Ahí se queda la franja entera. */
@media (min-aspect-ratio: 3/2){
  .capa.alta{ padding:3% 6% 6% 6% }
}
.capa.vista{opacity:1}
.capa .fondo{
  position:absolute;inset:-6%;
  background-size:cover;background-position:center;
  filter:blur(38px) saturate(1.15) brightness(.5);
  transform:scale(1.06);
}
.capa .velo{
  position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(12,3,8,.55) 100%);
}
.capa img{
  /* OJO con esto, que no es obvio:
     antes era max-width/max-height, y eso sólo ACHICA. Una foto que
     llega más chica que el hueco (el compresor del celular puede bajarla
     hasta 800 px cuando la señal está mal) se quedaba en su tamaño real
     y en un proyector se veía chiquita en el medio de la pantalla.
     Medido: ocupaba el 11% del proyector.

     Con width/height al 100% + object-fit:contain, la foto SIEMPRE
     llena el hueco, se agrande o se achique, y nunca se deforma.

     Y la sombra pasa a ser drop-shadow en vez de box-shadow: box-shadow
     dibuja el rectángulo del hueco (incluidas las franjas vacías de los
     costados), drop-shadow sigue el contorno de la foto de verdad. */
  position:static;
  width:100%;height:100%;
  object-fit:contain;display:block;
  filter:
    drop-shadow(0 2px 6px rgba(0,0,0,.35))
    drop-shadow(0 12px 26px rgba(0,0,0,.35))
    drop-shadow(0 34px 60px rgba(0,0,0,.45));
}
/* Un movimiento lentísimo, apenas perceptible: la pantalla "respira"
   en vez de quedar congelada entre foto y foto.
   OJO: este 1.045 tiene un gemelo en el código, la constante ZOOM_MAX.
   Si cambiás uno, cambiá el otro, o la foto vuelve a taparle el QR. */
.capa.vista img{animation:respirar 9s ease-out forwards}
@keyframes respirar{
  from{transform:scale(1)}
  to{transform:scale(1.045)}
}
@media (prefers-reduced-motion:reduce){
  .capa.vista img{animation:none}
}

/* ---------- la firma de quien la sacó ---------- */
#firma{
  position:fixed;left:0;right:0;bottom:0;
  padding:44px 56px 40px;
  background:linear-gradient(to top, rgba(10,2,6,.78), transparent);
  display:flex;align-items:flex-end;justify-content:space-between;gap:40px;
  pointer-events:none;
}
#firma-nombre{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:clamp(1.6rem,3.4vw,2.9rem);line-height:1.1;
  text-shadow:0 2px 14px rgba(0,0,0,.6);
  opacity:0;transition:opacity .8s ease .4s;
}
#firma-nombre.vista{opacity:1}
#firma-nombre small{
  display:block;font-family:"Nunito",sans-serif;
  font-size:.34em;letter-spacing:.18em;text-transform:uppercase;
  font-weight:700;opacity:.6;margin-bottom:4px;
}

/* El QR chiquito, siempre visible: el que levanta la vista sabe qué hacer. */
#qr-chico{
  display:flex;align-items:center;gap:14px;flex:none;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(8px);
  border-radius:16px;padding:12px 18px 12px 12px;
}
#qr-chico img{width:92px;height:92px;border-radius:8px;background:#fff;display:block}
#qr-chico .t{font-size:clamp(.85rem,1.2vw,1.05rem);line-height:1.3;font-weight:700}
#qr-chico .t span{display:block;font-weight:400;opacity:.72;font-size:.86em}

/* ---------- la placa grande del QR ---------- */
#placa{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;text-align:center;padding:34px;
  background:
    radial-gradient(70% 55% at 30% 25%, rgba(245,103,112,.20), transparent 60%),
    radial-gradient(60% 50% at 78% 75%, rgba(109,18,51,.35), transparent 62%),
    var(--fondo);
  opacity:0;pointer-events:none;transition:opacity 1s ease;
}
#placa.vista{opacity:1}
#placa h1{font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.05;max-width:16ch}
#placa p{margin:0;font-size:clamp(1rem,2vw,1.5rem);opacity:.8;max-width:26ch}
#placa .marco{
  background:#fff;padding:18px;border-radius:22px;
  box-shadow:
    0 3px 8px rgba(0,0,0,.4),
    0 20px 44px -10px rgba(0,0,0,.55),
    0 50px 90px -30px rgba(0,0,0,.7);
}
/* Grande de verdad: esto se escanea desde una mesa del fondo. Un QR
   chico proyectado a 4 metros no lo lee ningún celular. */
#placa .marco img{display:block;width:clamp(220px,38vh,460px);height:auto}
#placa .pie{font-size:clamp(.8rem,1.3vw,1.05rem);letter-spacing:.2em;
  text-transform:uppercase;font-weight:700;opacity:.55}

/* ---------- el libro de firmas en grande ----------
   Cada tantas fotos entra un mensaje. Ocupa toda la pantalla igual que la
   placa del QR: es lo mismo que ya hace esta pantalla, no una mecanica nueva.
   ⚠️ El audio NO suena. Hay musica y gente hablando; un saludo saliendo por
   los parlantes del salon sin que nadie lo pida es una sorpresa desagradable.
   Se anuncia quien lo dejo, y se escucha en el album. */
#mensaje{
  position:fixed;inset:0;z-index:18;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;text-align:center;padding:6vh 8vw;
  background:
    radial-gradient(66% 52% at 24% 22%, rgba(245,103,112,.18), transparent 62%),
    radial-gradient(58% 48% at 80% 78%, rgba(109,18,51,.34), transparent 64%),
    var(--fondo);
  opacity:0;pointer-events:none;transition:opacity 1s ease;
}
#mensaje.vista{opacity:1}
#msg-texto{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:clamp(1.7rem,5.2vw,4.4rem);line-height:1.22;
  max-width:20ch;text-wrap:balance;
  text-shadow:0 2px 18px rgba(0,0,0,.45);
}
/* Un mensaje de 500 letras en cuerpo de titular no entra en la pantalla.
   El codigo le pone la clase segun cuanto escribio el invitado. */
#msg-texto.largo{font-size:clamp(1.2rem,3vw,2.4rem);max-width:34ch;line-height:1.3}
#msg-texto.medio{font-size:clamp(1.4rem,4vw,3.2rem);max-width:26ch}
#msg-texto::before{content:"\201C";opacity:.5;margin-right:.08em}
#msg-texto::after{content:"\201D";opacity:.5;margin-left:.06em}
#msg-quien{
  font-family:"Nunito",sans-serif;font-weight:700;
  font-size:clamp(.78rem,1.3vw,1.05rem);letter-spacing:.2em;text-transform:uppercase;
  opacity:.62;
}
#msg-micro{
  width:clamp(78px,11vh,128px);height:clamp(78px,11vh,128px);border-radius:50%;
  display:none;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 30% 8%, rgba(255,255,255,.28) 0%, transparent 60%), var(--acento);
  box-shadow:0 3px 8px rgba(0,0,0,.4), 0 22px 46px -12px rgba(0,0,0,.6);
}
#mensaje.es-audio #msg-micro{display:flex}
#msg-micro svg{width:52%;height:52%;fill:none;stroke:#fff;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
#msg-pie{margin:0;font-size:clamp(.9rem,1.6vw,1.25rem);opacity:.66;max-width:30ch}

/* ---------- avisos ---------- */
#aviso{
  position:fixed;top:26px;left:50%;transform:translateX(-50%);z-index:40;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(8px);
  padding:12px 24px;border-radius:99px;font-size:1rem;font-weight:600;
  opacity:0;transition:opacity .5s ease;pointer-events:none;
}
#aviso.vista{opacity:1}
#arranque{
  position:fixed;inset:0;z-index:50;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:40px;background:var(--fondo);
}
#arranque h2{font-size:clamp(1.8rem,4vw,3rem)}
#arranque p{margin:0;opacity:.7;font-size:1.05rem;max-width:34ch}
#arranque .btn{
  margin-top:10px;padding:16px 38px;border-radius:99px;border:none;
  background:radial-gradient(120% 100% at 30% 0%, #FF8992 0%, transparent 60%), var(--acento);
  color:#fff;font-family:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;
  box-shadow:0 2px 4px rgba(0,0,0,.3), 0 14px 26px -8px rgba(0,0,0,.5),
    inset 0 1.5px 0 rgba(255,255,255,.45);
}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="escena"></div>

<div id="firma">
  <div id="firma-nombre"></div>
  <div id="qr-chico" hidden>
    <img id="qr-mini" alt="">
    <div class="t">Toma tus fotos<span>Escanea y súbelas aquí</span></div>
  </div>
</div>

<div id="placa">
  <h1 id="placa-titulo">Toma tus fotos y súbelas</h1>
  <div class="marco"><img id="qr-grande" alt="Código QR de la galería"></div>
  <p>Escanea el código con la cámara del celular.<br>Las fotos aparecen aquí.</p>
  <div class="pie" id="placa-pie"></div>
</div>

<div id="mensaje">
  <div id="msg-micro"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg></div>
  <div id="msg-texto"></div>
  <div id="msg-quien"></div>
  <p id="msg-pie"></p>
</div>

<div id="aviso"></div>

<div id="arranque">
  <h2 id="arranque-titulo">Pantalla del salón</h2>
  <p id="arranque-texto">Toca el botón para empezar. Se abre a pantalla completa y no se apaga sola.</p>
  <button class="btn" id="arranque-btn" type="button">Empezar</button>
</div>

<script type="module">
/* ============================================================
   Orden de este archivo, y por qué:

   1) Primero se declara TODO el estado del bucle y sus funciones.
      Firestore avisa apenas te suscribís, y ese aviso toca el estado.
      Si la suscripción va antes, el primer aviso llega cuando las
      variables todavía no existen y la pantalla queda negra.
      (Pasó. Lo agarró el banco de pruebas.)

   2) La pantalla arranca SIN esperar a Firestore, con lo que tenga
      guardado de la última vez. El wifi de un salón no es confiable:
      la pantalla tiene que prender igual y después ponerse al día.

   3) Firebase se carga con import() adentro de un try. Si ese día no
      se puede bajar la librería, la pantalla sigue funcionando con
      las fotos cacheadas en vez de quedar en blanco.

   4) NADA que tenga que verse depende de que la pestaña esté adelante.
      En una pestaña oculta Chrome no ejecuta requestAnimationFrame y NO
      resuelve img.decode(). Las dos cosas dejaban la pantalla negra.
      (Pasó en vivo: la foto bajada entera y la capa sin mostrarse.)
   ============================================================ */

const WORKER = 'https://galeria.littlemomentsok.workers.dev';
const CACHE = 'pantalla-fotos-v1';

const params = new URLSearchParams(location.search);
const GID = (params.get('g') || '').trim();
/* Cuánto dura cada foto y cada cuántas entra la placa del QR.
   Se pueden cambiar desde la URL para probar: ?seg=4&cada=3 */
const SEG = Math.max(2, parseInt(params.get('seg') || '7', 10) || 7) * 1000;
const CADA = Math.max(3, parseInt(params.get('cada') || '9', 10) || 9);
/* Y cada cuantas fotos entra un mensaje del libro de firmas. Mas seguido que
   el QR: el mensaje es lo que la gente vino a ver, el QR es una instruccion. */
const MENS = Math.max(2, parseInt(params.get('mens') || '4', 10) || 4);

const $ = (id) => document.getElementById(id);

if (!/^[A-Za-z0-9_-]{16,64}$/.test(GID)) {
  $('arranque-titulo').textContent = 'Falta el código del evento';
  $('arranque-texto').textContent =
    'Esta pantalla se abre con el link que te da el panel, el que termina en ?g= y el código de la fiesta.';
  $('arranque-btn').hidden = true;
} else {
  preparar();
}

function preparar() {

  const urlQR = WORKER + '/qr?g=' + encodeURIComponent(GID);
  $('qr-mini').src = urlQR;
  $('qr-grande').src = urlQR;

  /* ---------- 1. el estado ---------- */

  const LLAVE = 'pantalla:' + GID;

  function leerGuardadas() {
    try { return JSON.parse(localStorage.getItem(LLAVE) || '[]'); } catch (e) { return []; }
  }
  function guardar() {
    try { localStorage.setItem(LLAVE, JSON.stringify(fotos.slice(0, 400))); } catch (e) {}
  }

  let fotos = leerGuardadas();
  let vivas = {};
  fotos.forEach((f) => { vivas[f.id] = true; });

  /* El libro de firmas se guarda igual que las fotos: si el wifi del salon
     se cae, los mensajes que ya llegaron se siguen pasando. Son texto: pesan
     nada al lado de una foto. */
  const LLAVE_F = 'pantalla-firmas:' + GID;
  let firmas = [];
  try { firmas = JSON.parse(localStorage.getItem(LLAVE_F) || '[]'); } catch (e) { firmas = []; }
  let jf = -1;
  /* Cuantas FOTOS se pintaron desde el ultimo mensaje. Cuenta fotos, no
     vueltas: si contara vueltas, el propio mensaje gastaria una y las tandas
     saldrian de tres fotos en vez de cuatro. */
  let desdeMensaje = 0;
  /* El id del mensaje que se está viendo AHORA, o null si lo que se ve es una
     foto. No alcanza con jf: jf recuerda el último mostrado aunque ya haya
     vuelto una foto, y por eso bajaría una foto a la mitad sin motivo. */
  let msgEnPantalla = null;

  let i = -1;
  let enPantalla = null;
  let vueltas = 0;
  let reloj = null;
  let capaActual = null;
  const enMemoria = new Map();   // id -> object URL

  /* ---------- avisos y placa ---------- */

  function avisar(txt) {
    const a = $('aviso');
    a.textContent = txt;
    a.classList.add('vista');
    clearTimeout(avisar._t);
    avisar._t = setTimeout(() => a.classList.remove('vista'), 3200);
  }
  function mostrarPlaca(si) { $('placa').classList.toggle('vista', si); }

  /* ---------- un mensaje del libro de firmas, a pantalla completa ---------- */
  function ocultarMensaje() { msgEnPantalla = null; $('mensaje').classList.remove('vista'); }
  /* Devuelve cuantos milisegundos conviene dejarlo: un mensaje largo se lee
     mas despacio que "Felicidades". Sale de contar letras, no de adivinar. */
  function mostrarMensaje(f) {
    const caja = $('mensaje');
    const t = $('msg-texto');
    const esAudio = f.tipo === 'audio';
    caja.classList.toggle('es-audio', esAudio);

    /* textContent, NUNCA innerHTML: esto lo escribio un invitado. */
    t.textContent = esAudio ? '' : (f.texto || '');
    t.hidden = esAudio;
    const n = (f.texto || '').length;
    t.classList.toggle('largo', n > 190);
    t.classList.toggle('medio', n > 90 && n <= 190);

    $('msg-quien').textContent = f.nombre || 'Un invitado';
    $('msg-pie').textContent = esAudio
      ? (f.nombre || 'Un invitado') + ' dejó un saludo de voz. Se escucha en el álbum.'
      : '';
    $('msg-pie').hidden = !esAudio;

    msgEnPantalla = f.id;
    caja.classList.add('vista');
    /* 3,2 s de piso + el tiempo de leerlo (unas 13 letras por segundo),
       con techo de 14 s para que no se coma la fiesta. */
    return esAudio ? 5200 : Math.min(14000, 3200 + n * 77);
  }

  /* ---------- la caché de fotos ----------
     Cada foto se guarda entera la primera vez que se muestra. Después
     sale de ahí, sin pedirle nada a la red. Es lo que hace que un corte
     de wifi en plena fiesta no se note. */

  async function bajar(f) {
    if (enMemoria.has(f.id)) return enMemoria.get(f.id);
    const url = WORKER + '/f/' + f.key;
    let blob = null;
    try {
      const c = await caches.open(CACHE);
      let r = await c.match(url);
      if (!r) {
        r = await fetch(url, { mode: 'cors' });
        if (r && r.ok) { try { await c.put(url, r.clone()); } catch (e) {} }
      }
      if (r && r.ok) blob = await r.blob();
    } catch (e) {
      try { const r = await fetch(url); if (r.ok) blob = await r.blob(); } catch (e2) {}
    }
    if (!blob) return null;
    const o = URL.createObjectURL(blob);
    enMemoria.set(f.id, o);
    /* No dejamos crecer la memoria para siempre: quedan las últimas 12. */
    if (enMemoria.size > 12) {
      const viejo = enMemoria.keys().next().value;
      URL.revokeObjectURL(enMemoria.get(viejo));
      enMemoria.delete(viejo);
    }
    return o;
  }

  /* ---------- pintar una foto ---------- */

  async function pintar(f) {
    const src = await bajar(f);
    if (!src) return false;
    if (!vivas[f.id]) return false;             /* la sacaron mientras bajaba */

    const capa = document.createElement('div');
    capa.className = 'capa';
    const fondo = document.createElement('div');
    fondo.className = 'fondo';
    fondo.style.backgroundImage = 'url("' + src + '")';
    const velo = document.createElement('div');
    velo.className = 'velo';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    capa.appendChild(fondo); capa.appendChild(velo); capa.appendChild(img);
    $('escena').appendChild(capa);

    /* decode() sirve para que la foto entre ya descomprimida y no parpadee.
       PERO en una pestaña que no está adelante Chrome NO lo resuelve NUNCA:
       la promesa queda colgada, el bucle se frena ahí y la pantalla queda
       negra para siempre. (Pasó en vivo el 30/8: la foto cargada entera,
       naturalWidth 1600, y la capa sin mostrarse.)
       Por eso corre contra un reloj: si en 300 ms no contestó, seguimos.
       La foto ya está bajada, así que no se ve peor. */
    await Promise.race([
      img.decode().catch(() => {}),
      new Promise((r) => setTimeout(r, 300))
    ]);

    /* ¿la foto es alta o ancha PARA ESTA PANTALLA? De eso depende cuánto
       lugar hay que reservarle abajo (ver el CSS de .capa).

       No alcanza con comparar proporciones: una foto casi cuadrada es
       "más alta" que un proyector 16:9 y sin embargo sale bien ancha y
       llega al QR. Así que probamos y MEDIMOS: si con el hueco grande la
       foto le queda encima al cartelito, le devolvemos la franja.
       Sin números mágicos y funciona en cualquier pantalla. */
    const dImg = (img.naturalWidth || 1) / (img.naturalHeight || 1);
    const dPan = (window.innerWidth || 1) / (window.innerHeight || 1);
    if (dImg < dPan) {
      capa.classList.add('alta');
      void capa.offsetWidth;
      if (pisaElQR(capa, img)) capa.classList.remove('alta');
    }

    /* Acá había un requestAnimationFrame, que en una pestaña oculta
       tampoco corre. offsetWidth fuerza el cálculo de estilo igual y no
       depende de que la pestaña esté visible. */
    void capa.offsetWidth;
    capa.classList.add('vista');

    const anterior = capaActual;
    capaActual = capa;
    if (anterior) setTimeout(() => anterior.remove(), 1600);

    const n = $('firma-nombre');
    n.classList.remove('vista');
    if (f.nombre) {
      n.textContent = '';
      const chico = document.createElement('small');
      chico.textContent = 'Foto de';
      n.appendChild(chico);
      n.appendChild(document.createTextNode(f.nombre));
      void n.offsetWidth;
      n.classList.add('vista');
    } else {
      n.textContent = '';
    }
    enPantalla = f.id;
    return true;
  }

  /* Cuánto se agranda la foto mientras se muestra. Tiene que ser igual
     al 'to' de @keyframes respirar, allá arriba en el CSS. */
  const ZOOM_MAX = 1.045;

  /* ¿la foto se superpone con el cartelito del QR?

     Dos trampas, las dos vistas en vivo:

     1) La caja del <img> NO es la foto. Con object-fit:contain la caja
        ocupa todo el hueco y adentro quedan franjas vacías a los
        costados. Hay que calcular el rectángulo de la foto de verdad.

     2) La foto NO se queda quieta: al aparecer arranca 'respirar' y
        crece hasta ZOOM_MAX. Si la medimos con el tamaño que tiene al
        aparecer nos da que no toca el QR... y tres segundos después lo
        tapa. (Pasó en vivo el 30/8 en una pantalla ancha: una foto 4:3
        al 47% de la pantalla se le venía encima al cartelito por abajo
        a la derecha.) Por eso medimos el tamaño MÁS GRANDE que va a
        tener, no el que tiene ahora.

     Por lo mismo NO usamos getBoundingClientRect() del <img>: esa caja
     ya viene con la animación aplicada y da distinto según el momento
     en que preguntes. Salimos del hueco de la capa, que no se mueve. */
  function pisaElQR(capa, img) {
    const q = $('qr-chico');
    if (!q || q.hidden) return false;
    if (!img.naturalWidth || !img.naturalHeight) return false;

    const r = capa.getBoundingClientRect();
    const s = getComputedStyle(capa);
    const arriba = parseFloat(s.paddingTop) || 0;
    const der = parseFloat(s.paddingRight) || 0;
    const abajo = parseFloat(s.paddingBottom) || 0;
    const izqP = parseFloat(s.paddingLeft) || 0;
    const hueW = r.width - izqP - der, hueH = r.height - arriba - abajo;
    if (hueW <= 0 || hueH <= 0) return false;

    const esc = Math.min(hueW / img.naturalWidth, hueH / img.naturalHeight) * ZOOM_MAX;
    const w = img.naturalWidth * esc, h = img.naturalHeight * esc;
    const izq = r.left + izqP + (hueW - w) / 2;
    const arr = r.top + arriba + (hueH - h) / 2;

    const b = q.getBoundingClientRect();
    return !(izq + w < b.left || izq > b.right || arr + h < b.top || arr > b.bottom);
  }

  /* ---------- el bucle ---------- */

  async function siguiente() {
    clearTimeout(reloj);

    if (!fotos.length && !firmas.length) {
      enPantalla = null;
      $('qr-chico').hidden = true;
      $('firma-nombre').classList.remove('vista');
      ocultarMensaje();
      mostrarPlaca(true);
      reloj = setTimeout(siguiente, 4000);
      return;
    }

    $('qr-chico').hidden = false;

    /* Cada CADA fotos, la placa grande: los que llegan tarde también
       tienen que enterarse de que pueden subir las suyas. */
    if (vueltas > 0 && vueltas % CADA === 0) {
      vueltas++;
      ocultarMensaje();
      mostrarPlaca(true);
      reloj = setTimeout(siguiente, 6500);
      return;
    }
    mostrarPlaca(false);

    /* Y cada MENS, un mensaje del libro de firmas. Va DESPUÉS del QR a
       propósito: si los dos caen en la misma vuelta, gana el QR y el
       mensaje entra en la siguiente. Dos pantallas seguidas sin foto
       hacen que parezca que se colgó. */
    const tocaMensaje = firmas.length && (!fotos.length || desdeMensaje >= MENS);
    if (tocaMensaje) {
      desdeMensaje = 0;
      jf = (jf + 1) % firmas.length;
      $('firma-nombre').classList.remove('vista');
      const cuanto = mostrarMensaje(firmas[jf]);
      reloj = setTimeout(siguiente, cuanto);
      return;
    }
    ocultarMensaje();

    /* La próxima que siga aprobada y se pueda pintar. */
    let intentos = 0;
    let listo = false;
    while (intentos < fotos.length + 1 && !listo) {
      i = (i + 1) % fotos.length;
      intentos++;
      const f = fotos[i];
      if (!f || !vivas[f.id]) continue;
      /* Si la que toca es la MISMA que ya está puesta (pasa cuando hay una
         sola foto aprobada), la dejamos quieta. Volver a pintarla haría que
         la misma foto se funda sobre sí misma cada pocos segundos. */
      if (f.id === enPantalla) { listo = true; break; }
      listo = await pintar(f);
    }

    if (!listo) {
      /* Ninguna se pudo pintar: sin red y sin caché todavía. */
      ocultarMensaje();
      mostrarPlaca(true);
      reloj = setTimeout(siguiente, 5000);
      return;
    }

    vueltas++;
    desdeMensaje++;
    adelantar();
    reloj = setTimeout(siguiente, SEG);
  }

  /* Bajamos la próxima mientras se ve la actual: así el cambio nunca
     se traba esperando la red. */
  function adelantar() {
    if (fotos.length < 2) return;
    const prox = fotos[(i + 1) % fotos.length];
    if (prox) bajar(prox).catch(() => {});
  }

  /* ---------- que no se apague la pantalla ---------- */

  let candado = null;
  async function noApagar() {
    try {
      if ('wakeLock' in navigator) candado = await navigator.wakeLock.request('screen');
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !candado) noApagar();
  });

  /* ---------- 2. arranque (el navegador exige un toque) ---------- */

  $('arranque-btn').onclick = async () => {
    $('arranque').hidden = true;
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    noApagar();
    siguiente();
  };

  document.addEventListener('mousemove', () => {
    document.body.style.cursor = 'default';
    clearTimeout(window.__cur);
    window.__cur = setTimeout(() => { document.body.style.cursor = 'none'; }, 2500);
  });

  /* ---------- 3. recién ahora, Firestore ---------- */

  conectar().catch(() => { /* sin base: seguimos con lo guardado */ });

  async function conectar() {
    const { initializeApp } =
      await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getFirestore, doc, getDoc, collection, query, where, onSnapshot } =
      await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

    const app = initializeApp({
      apiKey: 'AIzaSyBXWZc9xdpXx7HCkJfxcyofgI00buNlIXc',
      authDomain: 'invitame-9b51f.firebaseapp.com',
      projectId: 'invitame-9b51f'
    }, 'pantalla');
    const db = getFirestore(app);

    getDoc(doc(db, 'gal_eventos', GID)).then((s) => {
      if (!s.exists()) return;
      const ev = s.data();
      if (ev.marca && ev.marca.color) {
        document.documentElement.style.setProperty('--acento', ev.marca.color);
      }
      if (ev.nombre) {
        $('arranque-titulo').textContent = ev.nombre;
        $('placa-pie').textContent = ev.nombre;
        document.title = ev.nombre + ' · pantalla del salón';
      }
    }).catch(() => {});

    /* Es la MISMA consulta que usa la galería. Si el panel saca una foto
       con el botón de pánico, deja de estar 'aprobada' y esta pantalla se
       entera en el acto. */
    onSnapshot(
      query(collection(db, 'gal_fotos', GID, 'items'), where('estado', '==', 'aprobada')),
      (snap) => {
        const nuevas = [];
        snap.forEach((d) => {
          const f = d.data();
          if (!f.r2 || !f.r2.key) return;
          nuevas.push({
            id: d.id,
            key: f.r2.key,
            nombre: (f.autor && f.autor.nombre) || '',
            tsms: f.tsms || 0
          });
        });
        nuevas.sort((a, b) => (a.tsms || 0) - (b.tsms || 0));

        const antes = fotos.length;
        const eran = vivas;
        vivas = {};
        nuevas.forEach((f) => { vivas[f.id] = true; });
        fotos = nuevas;
        guardar();

        /* Si la que está en pantalla ya no está aprobada, se va YA. */
        if (enPantalla && !vivas[enPantalla]) { siguiente(); return; }
        if (antes === 0 && fotos.length > 0 && !enPantalla) { siguiente(); return; }

        const sumadas = nuevas.filter((f) => !eran[f.id]).length;
        if (antes > 0 && sumadas > 0) {
          avisar(sumadas === 1 ? 'Llegó una foto nueva' : 'Llegaron ' + sumadas + ' fotos nuevas');
        }
      },
      () => { /* sin señal: seguimos con lo que ya tenemos */ }
    );

    /* El libro de firmas aprobado. Mismo criterio que las fotos: lo que el
       panel baja con el botón de pánico desaparece de acá en el acto.
       Si esta consulta falla (la regla todavía sin publicar, por ejemplo) NO
       pasa nada: la pantalla sigue pasando fotos. Nunca se cae por esto. */
    onSnapshot(
      query(collection(db, 'gal_firmas', GID, 'items'), where('estado', '==', 'aprobada')),
      (snap) => {
        const nuevas = [];
        snap.forEach((d) => {
          const f = d.data();
          if (f.tipo !== 'audio' && !String(f.texto || '').trim()) return;
          nuevas.push({
            id: d.id,
            tipo: f.tipo === 'audio' ? 'audio' : 'texto',
            texto: String(f.texto || '').slice(0, 500),
            nombre: (f.autor && f.autor.nombre) || '',
            tsms: f.tsms || 0
          });
        });
        nuevas.sort((a, b) => (a.tsms || 0) - (b.tsms || 0));

        const antes = firmas.length;
        const eran = {};
        firmas.forEach((f) => { eran[f.id] = true; });
        const puesto = (jf >= 0 && firmas[jf]) ? firmas[jf].id : null;
        firmas = nuevas;
        try { localStorage.setItem(LLAVE_F, JSON.stringify(firmas.slice(0, 300))); } catch (e) {}

        const sigue = puesto && nuevas.some((f) => f.id === puesto);
        /* El índice apuntaba a una posición de la lista vieja. */
        jf = sigue ? nuevas.findIndex((f) => f.id === puesto) : -1;

        /* Si el mensaje que se está VIENDO dejó de estar aprobado, se va YA,
           igual que una foto. Es el botón de pánico. */
        if (msgEnPantalla && !nuevas.some((f) => f.id === msgEnPantalla)) {
          ocultarMensaje(); siguiente(); return;
        }

        /* Sin ninguna foto todavía, un mensaje aprobado es lo único que hay
           para mostrar: que entre sin esperar. */
        if (antes === 0 && firmas.length > 0 && !fotos.length) { siguiente(); return; }

        const sumadas = nuevas.filter((f) => !eran[f.id]).length;
        if (antes > 0 && sumadas > 0) {
          avisar(sumadas === 1 ? 'Llegó un mensaje nuevo' : 'Llegaron ' + sumadas + ' mensajes nuevos');
        }
      },
      () => { /* sin permiso o sin señal: la pantalla sigue con las fotos */ }
    );
  }
}
