<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pía</title>
<style>
  :root{ --uva:#4A2C4D; --gris:#6B6B6B; --linea:#E4E0DA; }
  *{box-sizing:border-box}
  body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#2B2B2B;background:#fff;font-size:15px}
  .cartel{border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .cartel h1{margin:0;font-size:17px;font-weight:600}
  .cartel p{margin:5px 0 0;font-size:13px;line-height:1.45}
  .off  {background:#FCEBEB;color:#7A1F1F}
  .sel  {background:#FAEEDA;color:#7A4A08}
  .todas{background:#E1F5EE;color:#0F5E48}
  .cargando{background:#F1EFE8;color:#5F5E5A}
  h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);margin:0 0 8px}
  button.modo{display:block;width:100%;text-align:left;border:1px solid var(--linea);background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.3;color:#2B2B2B}
  button.modo:hover{border-color:#BDB7B0}
  button.modo .sub{display:block;font-size:12.5px;color:var(--gris);margin-top:3px}
  button.modo[aria-pressed="true"]{border-color:var(--uva);border-width:2px;background:#FAF8F6;font-weight:600}
  .charla{border:1px solid var(--linea);border-radius:10px;padding:12px 14px;margin-top:4px}
  .charla .estado{font-weight:600}
  .charla .ayuda{font-size:12.5px;color:var(--gris);margin-top:6px;line-height:1.45}
  .pie{margin-top:14px;font-size:11.5px;color:#9A958E;text-align:center}
</style>
</head>
<body>

<div id="cartel" class="cartel cargando">
  <h1>Leyendo el estado…</h1>
  <p>Un segundo.</p>
</div>

<h2>Modo general</h2>
<button class="modo" id="b-off" onclick="cambiar('off')">🔴 Apagada en todo
  <span class="sub">No contesta en ninguna charla</span></button>
<button class="modo" id="b-sel" onclick="cambiar('seleccion')">🟡 Solo donde yo diga
  <span class="sub">Contesta únicamente en las charlas marcadas con PIA SI</span></button>
<button class="modo" id="b-todas" onclick="cambiar('todas')">🟢 En todas las charlas
  <span class="sub">Contesta siempre, salvo donde la apagues a mano</span></button>

<h2 style="margin-top:18px">Esta charla</h2>
<div class="charla">
  <div class="estado" id="charla">—</div>
  <div class="ayuda">Se cambia con las macros <b>▶️ PIA SI</b> y <b>⏸️ PIA NO</b>, en el menú de acciones del chat.</div>
</div>

<div class="pie" id="pie">—</div>

<script>
var BASE = "https://n8n.littlemomentsok.com/webhook/";
var TOK  = "k7m3q9x2v5r8t4w6";
var RUTA = { off:"pia-apagar-", seleccion:"pia-seleccion-", todas:"pia-prender-" };
var convId = null;
var ocupado = false;

window.addEventListener("message", function(e){
  var d = e.data;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch(err){ return; } }
  if (!d || d.event !== "appContext") return;
  try { convId = d.data.conversation.id; } catch(err) { convId = null; }
  leer();
});

function pedirContexto(){
  try { window.parent.postMessage("chatwoot-dashboard-app:fetch-info", "*"); } catch(e){}
}

function leer(){
  fetch(BASE + "pia-estado-" + TOK, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ conversation_id: convId })
  })
  .then(function(r){ return r.json(); })
  .then(pintar)
  .catch(function(){ pintarError(); });
}

function pintar(e){
  var c = document.getElementById("cartel");
  var textos = {
    off:      ["🔴 Pía está apagada", "No le contesta a nadie. Están respondiendo ustedes."],
    seleccion:["🟡 Pía contesta solo donde ustedes digan", "Está callada por defecto. Habla nada más en las charlas marcadas con PIA SI."],
    todas:    ["🟢 Pía está contestando en todas las charlas", "Le responde a todo el mundo, menos donde la apaguen a mano."]
  };
  var t = textos[e.modo] || textos.off;
  c.className = "cartel " + (e.modo === "todas" ? "todas" : e.modo === "seleccion" ? "sel" : "off");
  c.querySelector("h1").textContent = t[0];
  c.querySelector("p").textContent  = t[1];

  marcar("b-off",   e.modo === "off");
  marcar("b-sel",   e.modo === "seleccion");
  marcar("b-todas", e.modo === "todas");

  var ch = document.getElementById("charla");
  if (convId === null)      ch.textContent = "No pude leer de qué charla se trata";
  else if (e.charla_no)     ch.textContent = "⏸️ Pía apagada acá — no contesta en ningún modo";
  else if (e.charla_si)     ch.textContent = "▶️ Pía habilitada acá";
  else                      ch.textContent = "Sin marcar — sigue lo que diga el modo general";

  document.getElementById("pie").textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  ocupado = false;
}

function pintarError(){
  var c = document.getElementById("cartel");
  c.className = "cartel cargando";
  c.querySelector("h1").textContent = "No pude leer el estado";
  c.querySelector("p").textContent  = "Probá recargar. Si sigue igual, avisale a Maxi.";
  ocupado = false;
}

function marcar(id, si){
  document.getElementById(id).setAttribute("aria-pressed", si ? "true" : "false");
}

function cambiar(modo){
  if (ocupado) return;
  if (modo === "todas" && !confirm("Pía va a contestarle a TODAS las clientas que escriban. ¿Seguro?")) return;
  ocupado = true;
  var c = document.getElementById("cartel");
  c.className = "cartel cargando";
  c.querySelector("h1").textContent = "Cambiando…";
  c.querySelector("p").textContent  = "";
  fetch(BASE + RUTA[modo] + TOK, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ origen:"panel" })
  })
  .then(function(){ setTimeout(leer, 900); })
  .catch(function(){ pintarError(); });
}

pedirContexto();
setTimeout(pedirContexto, 1200);
setTimeout(function(){ if (convId === null) leer(); }, 2500);
setInterval(function(){ if (!ocupado) leer(); }, 12000);
</script>
</body>
</html>
