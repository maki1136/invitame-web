<body>
<div id="gate">
  <div class="gbox">
    <div class="gwm">inv&iacute;tame!</div>
    <p>Ingres&aacute; con el usuario del equipo</p>
    <input id="gmail" type="email" placeholder="Correo" autocomplete="username" autofocus>
    <input id="gp" type="password" placeholder="Contrase&ntilde;a" autocomplete="current-password" onkeydown="if(event.key==='Enter')chkpass()">
    <button onclick="chkpass()">Entrar</button>
    <div id="gm"></div>
  </div>
</div>
<script>
  // Login real con Firebase Auth (usuario del equipo)
  function chkpass(){
    var e=(document.getElementById('gmail').value||'').trim(), p=document.getElementById('gp').value, m=document.getElementById('gm');
    if(!e||!p){ m.textContent='Completá el correo y la contraseña'; return; }
    m.textContent='Entrando…';
    (function tryLogin(){
      if(!window.INV||!window.INV.auth){ setTimeout(tryLogin,300); return; }
      window.INV.login(e,p).then(function(){ m.textContent=''; })
        .catch(function(){ m.textContent='Correo o contraseña incorrectos'; document.getElementById('gp').value=''; });
    })();
  }
  (function watch(){
    if(!window.INV||!window.INV.auth){ setTimeout(watch,300); return; }
    window.INV.onAuth(function(u){ var g=document.getElementById('gate'); if(g) g.style.display = u ? 'none' : 'flex'; });
  })();
  window.salir=function(){ if(window.INV&&window.INV.logout) window.INV.logout(); };
</script>
  <div class="top">
  <div class="brandlogo">
    <!-- EL LOGO DEL ADMIN · 7/9/2026
         Antes vivía acá adentro como base64: 9 KB de imagen escritos dentro del
         HTML. Ahora es un archivo de verdad, que además se cachea en vez de
         viajar en cada carga del panel.
         ⚠️ NO volver a meterlo como base64. Una imagen adentro del HTML no se
            puede copiar de un archivo a otro con garantía de que llegue
            idéntica (son 12.364 caracteres al azar), y un solo carácter
            cambiado la deja rota sin que se note. -->
    <img class="blogo" alt="Invítame" src="/invitame-logo-admin.png">
    <span class="wm">invítame!</span>
    <span class="adm">ADMIN</span>
  </div>
  <div class="sp"></div>
  <button class="btn-c" onclick="verSolicitudes()" title="Solicitudes de clientes por revisar">📥 Solicitudes <span id="solic-badge" style="display:none;background:#F56770;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800;margin-left:2px">0</span></button>
  <button class="btn-c" onclick="verInvitaciones()" title="Ver todas las invitaciones">🗂 Invitaciones</button>
  <button class="btn-c" onclick="duplicarActual()" title="Hacer una copia de esta invitación para otra pareja">⧉ Duplicar</button>
  <button class="btn-c" onclick="abrirEscaner()" title="Abrir el control de acceso para escanear los QR en la puerta">🎟️ Escáner puerta</button>
  <button class="btn-c" onclick="backup()" title="Descargar copia de seguridad">⬇ Backup</button>
  <button class="btn-c" onclick="restaurar()" title="Volver a subir una copia de seguridad">⬆ Restaurar</button>
  <button class="btn-c" onclick="limpiarVencidas()" title="Borrar invitaciones vencidas (+90 días de la fecha) para liberar la base">🧹 Limpiar vencidas</button>
  <button class="btn-g" onclick="publicar()">Guardar y publicar</button>
  <button class="btn-c" onclick="salir()" title="Cerrar sesión del equipo">Salir</button>
</div>

<div class="layout">
  <div class="editor">
    <div class="tabs" id="tabs"></div>
    <div class="panel"><div class="col" id="panel"></div></div>
  </div>
  <div class="stage">
    <div class="phone"><div class="screen" id="screen">
      <iframe id="pv-frame" src="i/?preview=1" title="Vista previa de la invitación"
        style="width:100%;height:100%;border:0;display:block;background:#f4efe6"></iframe>
    </div></div>
  </div>
</div>

<!-- ⚠️ EL CEREBRO DEL PANEL, EN CUATRO ARCHIVOS · 7/9/2026
     Esto era UN solo <script> de 128 KB acá adentro, y por eso nada de
     admin.html se podía arreglar en el origen: no entra por la API de
     GitHub (techo medido: ~40 KB), así que cada corrección se escribía
     como un módulo aparte que corre después. Un parche.
     Maki: «hay que arreglar todo para siempre, no quiero parches».
     ⚠️ VAN EN ESTE ORDEN Y SIN `defer`: es el mismo orden que tenían
        adentro del script original, y el arranque está al final de la 4.
     ⚠️ Al partirlo se verificó que los cuatro, pegados uno atrás del
        otro, dan el script original IDÉNTICO byte a byte (salvo el
        arreglo del `{merge:true}`, que está comentado en la parte 3). -->
  <script src="/admin/1-campos.js"></script>
  <script src="/admin/2-panel.js"></script>
  <script src="/admin/3-evento.js"></script>
  <script src="/admin/4-solicitudes.js"></script>
<script src="/sobres/catalogo.js"></script>
<script type="module" src="/firebase-inv.js?v=23"></script>
<script type="module">
  import { collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  function _ready(){ return (window.INV&&window.INV.ok)?Promise.resolve():new Promise(r=>window.addEventListener('inv-ready',r,{once:true})); }
  window.solicListar=async function(){ await _ready(); const snap=await getDocs(query(collection(window.INV.db,'inv_solicitudes'), where('estado','==','pendiente'))); const arr=snap.docs.map(d=>({id:d.id,...d.data()})); arr.sort((a,b)=>((b.creado&&b.creado.seconds)||0)-((a.creado&&a.creado.seconds)||0)); return arr; };
  window.solicResolver=async function(id){ await _ready(); await updateDoc(doc(window.INV.db,'inv_solicitudes',id),{estado:'procesada'}); };
  _ready().then(()=>{ if(window.actualizarBadgeSolic) window.actualizarBadgeSolic(); });
</script>
