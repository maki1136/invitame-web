<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sacar el voseo del index.html</title>

<!-- ===== POR QUÉ EXISTE ESTA PÁGINA =========================================

     El motor está escrito en voseo argentino ("Ingresá", "Rascá para revelar")
     y el mercado es México. Hoy eso lo tapa `efectos/es-mx.js`, que traduce
     DESPUÉS de que la pantalla se dibujó. Funciona, pero es un parche: puede
     verse un parpadeo, y hay que mantenerlo para siempre.

     Corregirlo en el origen es mejor. El problema es que `index.html` pesa
     227 KB y NO se puede subir por API: habría que reescribirlo entero a mano,
     y en el archivo que cargan TODAS las invitaciones entregadas, un solo
     carácter mal lo rompe todo.

     Entonces: esta página hace el trabajo (baja el archivo, lo corrige, cuenta
     cada cambio y muestra las sumas de control) y te deja el archivo corregido
     descargado con el nombre final. Lo único que queda es arrastrarlo a GitHub.

     ⚠️ NO PUBLICA NADA. Sólo lee y descarga. Podés abrirla las veces que
        quieras sin miedo: hasta que no arrastres el archivo, no cambió nada.

     ⚠️ SE FIJA ANTES DE CAMBIAR. Si el motor cambió y aparecieron palabras de
        voseo nuevas que no están en la lista, te las muestra en rojo en vez de
        dejarlas pasar en silencio.
     ======================================================================= -->

<style>
  body{margin:0;padding:28px 22px 80px;font:15px/1.55 -apple-system,system-ui,sans-serif;
       color:#2a2521;background:#f2ede6;max-width:900px}
  h1{font-size:22px;margin:0 0 4px;font-weight:600}
  .baj{opacity:.7;font-size:13.5px;margin:0 0 22px}
  button{font:600 14px/1 inherit;padding:13px 20px;border:0;border-radius:10px;
         background:#3d4a3a;color:#fff;cursor:pointer}
  button[disabled]{opacity:.45;cursor:default}
  #bajar{background:#8a7a44;margin-left:8px}
  .caja{background:#fff;border-radius:12px;padding:16px 18px;margin:18px 0;
        box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .caja h2{font-size:13px;margin:0 0 10px;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  td{padding:4px 8px 4px 0;border-bottom:1px solid #eee}
  td.n{text-align:right;font-variant-numeric:tabular-nums;width:56px;font-weight:700}
  .cero{opacity:.38}
  .mal{color:#a3341f;font-weight:700}
  .ok{color:#3d6b33;font-weight:700}
  code{background:#efe9e0;padding:1px 5px;border-radius:4px;font-size:12.5px}
  .paso{margin:14px 0 0;font-size:14px}
</style>
</head>
<body>

<h1>Sacar el voseo del index.html</h1>
<p class="baj">No publica nada. Baja el archivo de producción, lo corrige, te muestra
   exactamente qué cambió y te lo deja descargado listo para arrastrar.</p>

<button id="correr">Revisar y corregir</button>
<button id="bajar" disabled>Descargar index.html corregido</button>

<div id="salida"></div>

<script>
/* Las frases van primero: algunas no se traducen palabra por palabra.
   Copiado tal cual de efectos/es-mx.js, que es donde está la lista buena. */
var FRASES = [
  ['Pasá el dedo para descubrir', 'Desliza el dedo para descubrir'],
  ['Pasá la voz',                 'Corre la voz'],
  ['Si querés tener un detalle',  'Si quieres tener un detalle'],
  ['dejamos nuestras mesas',      'aquí están nuestras mesas']
];

/* Las 18 que están de verdad en el motor. A propósito NO se incluyen las de
   "previsión" de es-mx.js: acá se toca el archivo de verdad, así que se cambia
   sólo lo que se sabe que existe. */
var PALABRAS = {
  'abrí':'abre', 'compartí':'comparte', 'entrá':'entra', 'escribí':'escribe',
  'escuchá':'escucha', 'esperá':'espera', 'ingresá':'ingresa', 'jugá':'juega',
  'mirá':'mira', 'pasá':'pasa', 'probá':'prueba', 'rascá':'raspa',
  'recargá':'recarga', 'subí':'sube', 'sumá':'agrega', 'sugerí':'sugiere',
  'tocá':'toca', 'rasca':'raspa'
};

/* NO son voseo aunque terminen igual. Si alguna apareciera en la lista, la
   invitación diría "Mama y Papa". Se usan para filtrar el aviso de palabras
   nuevas, no para reemplazar. */
var NO_TOCAR = ['mamá','papá','está','esté','aquí','asistiré','podré','mamá,','papá,',
                'aquí,','está,','día','días','sí','más','también','después','así'];

var CLAVES = Object.keys(PALABRAS).sort(function(a,b){return b.length-a.length;});
function escapar(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
var LIMITE = '0-9A-Za-zÁÉÍÓÚÜÑáéíóúüñ';

function conMayuscula(orig, nuevo){
  var c = orig.charAt(0);
  if (c === c.toUpperCase() && c !== c.toLowerCase())
    return nuevo.charAt(0).toUpperCase() + nuevo.slice(1);
  return nuevo.charAt(0).toLowerCase() + nuevo.slice(1);
}

function suma(s){var x=0;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x;}

var corregido = null;

document.getElementById('correr').onclick = async function(){
  var out = document.getElementById('salida');
  out.innerHTML = '<p class="paso">Bajando el index.html de producción…</p>';

  var orig;
  try {
    orig = await (await fetch('/index.html?cb=' + Date.now())).text();
  } catch (e) {
    out.innerHTML = '<p class="mal">No se pudo bajar el archivo: ' + e + '</p>';
    return;
  }

  var s = orig, cuenta = {}, total = 0;

  FRASES.forEach(function(f){
    var n = s.split(f[0]).length - 1;
    cuenta['«' + f[0] + '»'] = n; total += n;
    if (n) s = s.split(f[0]).join(f[1]);
  });

  CLAVES.forEach(function(k){
    var re = new RegExp('(^|[^' + LIMITE + '])(' + escapar(k) + ')(?![' + LIMITE + '])','gi');
    var n = 0;
    s = s.replace(re, function(todo, antes, pal){
      n++; return antes + conMayuscula(pal, PALABRAS[k]);
    });
    cuenta[k] = n; total += n;
  });

  /* ¿quedó algún voseo que la lista no conoce? */
  var sobrantes = (s.match(new RegExp('[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{3,}(á|é|í)(?![' + LIMITE + '])','g')) || []);
  var vistos = {}, nuevas = [];
  sobrantes.forEach(function(w){
    var l = w.toLowerCase();
    if (vistos[l] || NO_TOCAR.indexOf(l) >= 0) return;
    vistos[l] = 1; nuevas.push(w);
  });

  corregido = s;
  document.getElementById('bajar').disabled = false;

  var filas = Object.keys(cuenta).map(function(k){
    return '<tr class="' + (cuenta[k] ? '' : 'cero') + '"><td class="n">' +
           cuenta[k] + '</td><td>' + k + (cuenta[k] ? ' → ' + (PALABRAS[k] || 'frase nueva') : '') + '</td></tr>';
  }).join('');

  out.innerHTML =
    '<div class="caja"><h2>Qué cambió</h2>' +
      '<p class="paso"><b>' + total + '</b> reemplazos en total.</p>' +
      '<table>' + filas + '</table></div>' +

    '<div class="caja"><h2>El archivo</h2><table>' +
      '<tr><td class="n">' + orig.length + '</td><td>caracteres antes · suma ' + suma(orig) + '</td></tr>' +
      '<tr><td class="n">' + s.length + '</td><td>caracteres después · suma ' + suma(s) + '</td></tr>' +
      '<tr><td class="n">' + (s.length - orig.length) + '</td><td>diferencia (tiene que ser negativa o cero: las formas mexicanas son más cortas o iguales)</td></tr>' +
    '</table></div>' +

    '<div class="caja"><h2>Control</h2>' +
      (nuevas.length
        ? '<p class="mal">Ojo: quedaron ' + nuevas.length + ' palabras acentuadas que la lista no conoce. ' +
          'Revisalas antes de subir, puede que el motor haya sumado voseo nuevo:</p><p><code>' +
          nuevas.slice(0,40).join('</code> <code>') + '</code></p>'
        : '<p class="ok">No quedó voseo suelto que la lista no conozca.</p>') +
    '</div>' +

    '<div class="caja"><h2>Y ahora</h2>' +
      '<p class="paso">1. Apretá <b>Descargar</b>: te queda <code>index.html</code> en Descargas.</p>' +
      '<p class="paso">2. Arrastralo a la raíz del repo en GitHub y confirmá el commit.</p>' +
      '<p class="paso">3. Cuando el deploy termine y la invitación se vea bien, se puede borrar ' +
      '<code>efectos/es-mx.js</code> de la lista de <code>efectos/index.js</code>. Ese paso lo hago yo.</p>' +
    '</div>';
};

document.getElementById('bajar').onclick = function(){
  if (!corregido) return;
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([corregido], {type:'text/html'}));
  a.download = 'index.html';          /* el nombre final, para arrastrar y listo */
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
};
</script>
</body>
</html>
