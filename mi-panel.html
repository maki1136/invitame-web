<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi panel · Invítame</title>
<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--uva:#6D1233;--uva2:#49111A;--rosa:#F56770;--cream:#faf6f0;--line:#ece2d8;
        --ink:#3f3730;--muted:#9a8f88;--ok:#3f7d54;--no:#b0334a;--sin:#b9ada3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);font-family:'Nunito',system-ui,sans-serif;color:var(--ink)}
  a{color:inherit}

  /* ---------- login ---------- */
  .login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);
         border-radius:18px;padding:26px 22px;box-shadow:0 10px 30px rgba(73,17,26,.07)}
  .login h1{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--uva);
            font-size:26px;margin:0 0 4px;text-align:center}
  .login p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:12px;font-weight:800;color:var(--uva);margin:14px 0 5px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
        font-family:'Nunito';font-size:14px;background:#fff;color:var(--ink)}
  .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .btn{display:block;width:100%;border:0;border-radius:24px;padding:14px;margin-top:18px;
       font-family:'Nunito';font-weight:900;font-size:15px;cursor:pointer;background:var(--rosa);
       color:#fff;box-shadow:0 8px 20px rgba(245,103,112,.32)}
  .err{color:var(--no);font-size:13px;text-align:center;margin-top:12px;min-height:18px}

  /* ---------- estructura ---------- */
  .top{background:var(--uva);color:#fff;padding:13px 18px;display:flex;align-items:center;gap:12px;
       position:sticky;top:0;z-index:40}
  .top .marca{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;flex:1;line-height:1.1}
  .top .marca small{display:block;font-family:'Nunito';font-size:11px;opacity:.75;font-weight:700}
  .tbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:18px;padding:8px 14px;
        font-family:'Nunito';font-weight:800;font-size:12px;cursor:pointer}
  .burger{display:none;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;
          padding:8px 11px;font-size:16px;cursor:pointer;line-height:1}

  .cuerpo{display:flex;align-items:flex-start;gap:0}
  .lat{width:214px;flex:0 0 214px;background:#fff;border-right:1px solid var(--line);
       min-height:calc(100vh - 52px);padding:16px 0}
  .lat a{display:flex;align-items:center;gap:10px;padding:11px 18px;font-size:13.5px;
         font-weight:700;color:var(--ink);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
  .lat a:hover{background:#fbf7f2}
  .lat a.on{background:#fbf1f2;color:var(--uva);border-left-color:var(--rosa)}
  .lat .ico{width:18px;text-align:center;opacity:.8}
  .lat .sep{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.09em;
            padding:16px 18px 6px;text-transform:uppercase}
  .main{flex:1;min-width:0;padding:20px 22px 60px}

  .cabecera{margin-bottom:16px}
  .cabecera h2{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--uva);
               font-size:26px;margin:0}
  .cabecera .fecha{color:var(--muted);font-size:13px;margin-top:2px}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:15px;color:var(--uva);font-weight:900}

  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:18px}
  .num{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .num b{display:block;font-size:27px;color:var(--uva);line-height:1.15;font-weight:900}
  .num span{font-size:11.5px;color:var(--muted);font-weight:700}
  .num .barra{height:3px;border-radius:2px;background:#f0e8e0;margin-top:7px;overflow:hidden}
  .num .barra i{display:block;height:100%;background:var(--ok)}
  .num.rojo .barra i{background:var(--no)}

  .barrita{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filtro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 14px;
          font-family:'Nunito';font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink)}
  .filtro.on{background:var(--uva);border-color:var(--uva);color:#fff}
  .accion{background:var(--rosa);border:0;color:#fff;border-radius:18px;padding:8px 15px;
          font-family:'Nunito';font-weight:800;font-size:12.5px;cursor:pointer}
  .accion.gris{background:#efe7de;color:var(--uva2)}
  .accion.peligro{background:#fdecef;color:var(--no)}
  .lnk{background:none;border:0;color:var(--uva);font-family:'Nunito';font-weight:800;
       font-size:12.5px;cursor:pointer;text-decoration:underline}
  .buscador{flex:1;min-width:180px;max-width:320px}
  .buscador input{padding:8px 12px;border-radius:18px}

  /* ---------- tabla ---------- */
  .tablaWrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
  th{text-align:left;padding:11px 12px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
     color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;font-weight:900}
  td{padding:9px 12px;border-bottom:1px solid #f5efe8;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr.par td{background:#fdfaf7}
  .mini{width:56px;padding:5px 7px;border-radius:8px;text-align:center;font-weight:800;font-size:13px}
  .chip{display:inline-block;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:900}
  .chip.si{background:#e8f3ec;color:var(--ok)}
  .chip.no{background:#fdecef;color:var(--no)}
  .chip.sin{background:#f2ede8;color:var(--muted)}
  .chip.azul{background:#e9f0fb;color:#3a5f97}
  .lapiz{background:none;border:0;cursor:pointer;color:var(--muted);font-size:14px;padding:0 6px 0 0}
  .lapiz:hover{color:var(--uva)}
  .comp{display:flex;gap:7px}
  .comp button{background:none;border:0;cursor:pointer;font-size:15px;opacity:.55;padding:0}
  .comp button:hover{opacity:1}
  .vacio{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head>
<style>
  /* ---------- mesas ---------- */
  .refs{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;
        color:var(--muted);font-weight:700}
  .refs i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .grillaMesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
  .mesa{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
        display:flex;flex-direction:column}
  .mesa .cab{padding:10px 13px;color:#fff;display:flex;align-items:center;gap:8px;font-weight:900;font-size:13.5px}
  .mesa .cab .n{flex:1;background:none;border:0;color:#fff;font-family:'Nunito';font-weight:900;
                font-size:13.5px;padding:2px 4px;border-radius:6px;min-width:0}
  .mesa .cab .n:focus{background:rgba(255,255,255,.2);outline:0}
  .mesa .cab .cuenta{font-size:12px;opacity:.9;white-space:nowrap;font-weight:800}
  .mesa .cab .x{background:none;border:0;color:#fff;opacity:.7;cursor:pointer;font-size:15px;padding:0 2px}
  .mesa .cab .x:hover{opacity:1}
  .mesa.sinmesa .cab{background:#5b8ac9}
  .mesa .cab{background:var(--rosa)}
  .mesa.llena .cab{background:#c0392b}
  .zona{padding:8px;min-height:74px;flex:1;background:#fff}
  .zona.sobre{background:#fdf3f4;outline:2px dashed var(--rosa);outline-offset:-6px}
  .pers{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;
        background:#fdfaf7;border:1px solid #f3ece5;margin-bottom:6px;cursor:grab;font-size:13px}
  .pers:last-child{margin-bottom:0}
  .pers.arrastrando{opacity:.4}
  .pers .pto{width:11px;height:11px;border-radius:50%;flex:0 0 11px}
  .pers .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .pers .cant{font-weight:900;color:var(--uva)}
  .pers .mover{color:var(--muted);font-size:13px}
  .mesaVacia{color:var(--muted);font-size:12px;text-align:center;padding:14px 0;font-style:italic}

  /* ---------- mensajes ---------- */
  .grillaMsj{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
  .msj{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;
       display:flex;flex-direction:column}
  .msj .de{font-weight:900;font-size:14px;color:var(--uva2);margin-bottom:7px}
  .msj .txt{font-style:italic;color:#6b6058;font-size:13.5px;line-height:1.5;flex:1}
  .msj .pie{margin-top:11px;font-size:11.5px;color:var(--muted);font-weight:700}

  /* ---------- ventanas ---------- */
  .fondo{position:fixed;inset:0;background:rgba(73,17,26,.5);display:flex;align-items:flex-start;
         justify-content:center;padding:24px 16px;overflow:auto;z-index:60}
  .vent{background:#fff;border-radius:16px;max-width:430px;width:100%;padding:22px;margin:auto}
  .vent h3{margin:0 0 4px;color:var(--uva);font-size:18px;font-weight:900}
  .vent .fila{display:flex;gap:10px}
  .vent .fila>div{flex:1}
  .vent .pie{display:flex;gap:10px;margin-top:20px}
  .vent .pie .btn{margin-top:0}
  .vent .btn.gris{background:#efe7de;color:var(--uva2);box-shadow:none}

  /* ---------- hoja de QR ---------- */
  .hojaQR{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
  .hojaQR table{min-width:0}
  .hojaQR td{padding:14px 12px;vertical-align:middle}
  .hojaQR img{display:block;width:130px;height:130px}
  .hojaQR .lk{font-size:11.5px;color:var(--muted);word-break:break-all}

  .aviso{background:#FFF4E5;border:1px solid #F0C48A;color:#7A4A00;border-radius:10px;
         padding:10px 13px;font-size:12.5px;line-height:1.45;margin-bottom:14px}
  .guardando{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--uva2);
             color:#fff;padding:9px 18px;border-radius:22px;font-size:12.5px;font-weight:800;
             z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
  .guardando.ver{opacity:1}

  @media(max-width:820px){
    .burger{display:block}
    .lat{position:fixed;left:0;top:52px;bottom:0;z-index:50;transform:translateX(-100%);
         transition:transform .22s;box-shadow:0 0 30px rgba(0,0,0,.18);min-height:0;overflow:auto}
    .lat.abierto{transform:none}
    .main{padding:16px 14px 60px}
    .ocultar-chico{display:none}
  }
  @media print{
    .top,.lat,.barrita,.aviso{display:none!important}
    .main{padding:0}
    .hojaQR{border:0}
  }
</style>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="entrar">
  <div class="login">
    <h1>Mi panel</h1>
    <p class="sub">Mirá quién confirmó y armá tus mesas.</p>
    <label for="slug">Dirección de tu invitación</label>
    <input type="text" id="slug" placeholder="maria-y-diego" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="hint">Es lo que va después de /i/?e= en el link de tu invitación.</div>
    <label for="clave">Tu clave</label>
    <input type="password" id="clave" placeholder="La clave que te dimos">
    <button class="btn" id="btnEntrar">Entrar</button>
    <div class="err" id="errLogin"></div>
  </div>
</div>

<!-- ======================= PANEL ======================= -->
<div id="panel" style="display:none">
  <div class="top">
    <button class="burger" id="burger">&#9776;</button>
    <div class="marca">invítame!<small id="topSub">Mi panel</small></div>
    <button class="tbtn" id="btnRecargar">&#8635; Actualizar</button>
    <button class="tbtn" id="btnSalir">Salir</button>
  </div>

  <div class="cuerpo">
    <nav class="lat" id="lat">
      <div class="sep">Resumen</div>
      <a data-vista="resumen" class="on"><span class="ico">&#9788;</span> Panel de control</a>
      <div class="sep">Invitados</div>
      <a data-vista="invitados"><span class="ico">&#128101;</span> Personas y pases</a>
      <a data-vista="mesas"><span class="ico">&#127869;</span> Mesas</a>
      <a data-vista="itinerario"><span class="ico">&#9200;</span> Itinerario</a>
      <a data-vista="mensajes"><span class="ico">&#9993;</span> Mensajes</a>
      <div class="sep">Herramientas</div>
      <a data-vista="qr"><span class="ico">&#9635;</span> QR para imprimir</a>
      <a data-vista="opciones"><span class="ico">&#9881;</span> Opciones</a>
      <div class="sep">&nbsp;</div>
      <a id="verInv"><span class="ico">&#128065;</span> Ver mi invitación</a>
    </nav>

    <main class="main">
      <div class="cabecera">
        <h2 id="ttNombres">…</h2>
        <div class="fecha" id="ttFecha"></div>
      </div>
      <div id="vista"></div>
    </main>
  </div>
</div>
<div class="guardando" id="toast">Guardado</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- El grabador de mensajes de voz por invitado. Va ANTES del panel para que la
     lista ya lo encuentre cargado y dibuje la columna "Voz". Vive aparte de
     mi-panel.js porque ese archivo esta cerca del techo de subida (~45 KB). -->
<script defer src="/efectos/panel-audio-invitado.js"></script>
<script type="module" src="/mi-panel.js?v=2"></script>
</body>
</html>
